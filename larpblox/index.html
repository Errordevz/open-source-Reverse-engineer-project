nmax(230px,.8fr) minmax(0,1.2fr);gap:14px}.avatar-stage{min-height:390px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at 50% 40%,#303c59,#1b1f29 70%);border:1px solid #343a46;border-radius:14px;padding:18px}.avatar-stage .big-avatar{width:180px;height:220px;border-radius:18px;background:#2c3443;display:grid;place-items:center;font-size:90px;overflow:hidden}.avatar-stage img{width:100%;height:100%;object-fit:contain}.avatar-stage strong{font-size:13px}.avatar-stage small{color:#a8b0bd;font-size:10px}.editor-list{padding:15px}.editor-list h3{font-size:14px;margin:0 0 12px}.edit-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff12}.edit-row:last-child{border:0}.edit-row .item-image{width:52px;height:52px;flex:none;margin:0}.edit-row .detail{flex:1;min-width:0}.edit-row .detail strong{font-size:11px}.edit-row .detail small{font-size:10px;color:#a3aab8}.switch{accent-color:#547aff;width:17px;height:17px}.backdrop{position:fixed;inset:0;background:#0009;z-index:150;opacity:0;pointer-events:none;transition:opacity .2s}.backdrop.open{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:151;left:50%;bottom:0;transform:translate(-50%,105%);width:min(820px,100%);max-height:min(86vh,820px);background:#171a22;border:1px solid #444b5b;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -18px 70px #0008;transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}.sheet.open{transform:translate(-50%,0)}.sheet-head{padding:15px 18px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;gap:10px}.sheet-grab{width:34px;height:4px;border-radius:99px;background:#596071;position:absolute;top:7px;left:calc(50% - 17px)}.sheet-head strong{font-size:15px}.save-state{font-size:10px;color:#74dcb1;margin-left:auto}.sheet-close{border:1px solid #3c4350;background:#262b36;border-radius:8px;p <body>
<div class="top-hold" id="topHold" aria-label="Hold for Backstage"><div class="track"><div class="fill" id="holdFill"></div></div></div>
<div class="app">
<header class="topbar">
 <div class="brand"><span class="brand-mark">◈</span><span>LarpBlox</span></div>
 <span class="top-divider"></span><span class="crumb" id="crumb">Profile / Overview</span>
 <span class="spacer"></span><span class="sim-tag">SIMULATOR</span>
</header>
<div class="layout">
<aside class="sidebar"><div class="nav-label">DISCOVER</div><nav id="sideNav"></nav><div class="side-note">Independent fan-made simulator.<br>Never enter your Roblox password.<br><br>Hold the top edge to open Backstage.</div></aside>
<main class="main"><div id="view"></div></main>
</div>
<nav class="mobile-tabs" id="mobileTabs"></nav>
</div>
<div class="sim-watermark">SIMULATOR · NOT ROBLOX</div>
<div class="backdrop" id="backdrop" onclick="closeBackstage()"></div>
<section class="sheet" id="sheet" aria-label="Backstage settings">
 <div class="sheet-grab"></div>
 <header class="sheet-head"><strong>⚙ Backstage</strong><span class="save-state" id="saveState">● Saved locally</span><button class="sheet-close" onclick="closeBackstage()">Done ✕</button></header>
 <div class="sheet-body"><nav class="sheet-nav" id="sheetNav"></nav><div class="sheet-content" id="sheetContent"></div></div>
</section>
<div id="toast" class="toast hidden"></div>
<script>
const navItems=[["profile","◉","Profile"],["avatar","🧍","Avatar"],["catalog","▦","Catalog"],["inventory","🎒","Inventory"],["friends","♧","Friends"],["games","🎮","Games"],["badges","✦","Badges"]];
const defaults={name:"Player One",username:"player_one",bio:"Welcome to my profile!",about:"",avatarUrl:"",coverUrl:"",userId:null,coins:12500,followers:1240,following:85,friendsCount:48,visits:0,inventory:[{id:"demo-1",name:"Classic Cap",type:"Hat",emoji:"🧢",image:"",equipped:true},{id:"demo-2",name:"Pixel Shades",type:"Face Accessory",emoji:"🕶️",image:"",equipped:false},{id:"demo-3",name:"Blue Hoodie",type:"Shirt",emoji:"👕",image:"",equipped:true},{id:"demo-4",name:"Sparkle Trail",type:"Effect",emoji:"✨",image:"",equipped:false}],friends:[{name:"BuilderKai",emoji:"🧑‍🔧"},{name:"PixelMia",emoji:"👩‍🎨"},{name:"NovaPlays",emoji:"🧑‍🚀"},{name:"BlockyBen",emoji:"🧑‍💻"}],games:[{name:"Skyline Obby",description:"A colorful obstacle course",emoji:"🌆",visits:"8.2K"},{name:"Pet Plaza",description:"Collect and trade pets",emoji:"🐾",visits:"6.1K"},{name:"Tower Rush",description:"Climb to the top",emoji:"🗼",visits:"3.9K"}],badges:[{name:"Welcome!",emoji:"👋"},{name:"Explorer",emoji:"🧭"},{name:"Builder",emoji:"🛠️"}],outfit:"Classic",profileTab:"About"};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem("larpblox-v3")||"{}")}}catch{state={...defaults}}
if(!Array.isArray(state.inventory))state.inventory=[];if(!Array.isArray(state.friends))state.friends=[];if(!Array.isArray(state.games))state.games=[];if(!Array.isArray(state.badges))state.badges=[];
let active="profile",backstageTab="profile",inventoryFilter="All",avatarCategory="All";
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return Number(n||0).toLocaleString("en-US")}
function save(){try{localStorage.setItem("larpblox-v3",JSON.stringify(state));$("saveState").textContent="● Saved locally";$("saveState").style.color="#74dcb1"}catch(e){$("saveState").textContent="Storage full";$("saveState").style.color="#ff9b8c"}}
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2300)}
function avatarMarkup(){return state.avatarUrl?'<img src="'+esc(state.avatarUrl)+'" alt="Avatar">':"🧑‍🚀"}
function card(it){return '<article class="item-card"><div class="item-image">'+(it.image?'<img src="'+esc(it.image)+'" alt="">':esc(it.emoji||"🎁"))+'</div><strong>'+esc(it.name)+'</strong><small>'+esc(it.type||"Item")+'</small>'+(it.equipped?'<span class="pill">Equipped</span>':"")+'</article>'}
function renderNav(){const make=t=>'<button class="nav '+(active===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')"><span class="ico">'+t[1]+'</span>'+t[2]+'</button>';$("sideNav").innerHTML=navItems.map(make).join("");$("mobileTabs").innerHTML=navItems.slice(0,5).map(t=>'<button class="'+(active===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')"><span class="ico">'+t[1]+'</span>'+t[2]+'</button>').join("")}
function go(t){active=t;renderNav();render()}
function profileHero(){return '<section class="surface profile-panel"><div class="profile-cover" '+(state.coverUrl?'style="background-image:url(\''+esc(state.coverUrl)+'\');background-size:cover;background-position:center"':"")+'></div><div class="profile-info"><div class="profile-avatar">'+avatarMarkup()+'</div><div class="profile-copy"><div class="profile-name">'+esc(state.name)+'</div><div class="profile-handle">@'+esc(state.username)+(state.userId?' · ID '+state.userId:'')+'</div><div class="profile-bio">'+esc(state.bio)+'</div></div><div class="profile-actions"><button class="btn" onclick="toast(\'This is a local simulator action\')">＋ Add Friend</button><button class="btn ghost" onclick="toast(\'Demo profile — no real messages are sent\')">Message</button></div></div></section>'}
function profileView(){return '<div class="page-title"><div><h1>Profile</h1><div class="subtle">Your public player profile · Hold the top edge for 1 second to open Backstage</div></div></div>'+profileHero()+'<div class="stats"><div class="stat"><strong>'+fmt(state.friendsCount)+'</strong><span>Friends</span></div><div class="stat"><strong>'+fmt(state.followers)+'</strong><span>Followers</span></div><div class="stat"><strong>'+fmt(state.following)+'</strong><span>Following</span></div><div class="stat"><strong>'+fmt(state.coins)+'</strong><span>Demo coins</span></div></div><div class="columns"><div><section class="section"><div class="section-head"><h2>About</h2><span class="muted-link">PLAYER INFO</span></div><div class="surface about">'+esc(state.about||state.bio||"This player has not added an about section yet.")+'</div></section><section class="section"><div class="section-head"><h2>Currently Wearing</h2><button class="btn small ghost" onclick="go(\'avatar\')">Edit avatar</button></div><div class="mini-grid">'+(state.inventory.filter(x=>x.equipped).slice(0,3).map(x=>'<div class="tile"><div class="thumb">'+(x.image?'<img src="'+esc(x.image)+'">':esc(x.emoji||"🎁"))+'</div><strong>'+esc(x.name)+'</strong><small>'+esc(x.type)+'</small></div>').join("")||'<div class="empty">No equipped items yet.</div>')+'</div></section><section class="section"><div class="section-head"><h2>Creations</h2><button class="btn small ghost" onclick="go(\'games\')">See all</button></div><div class="mini-grid">'+state.games.slice(0,3).map(g=>'<div class="tile"><div class="thumb">'+(g.image?'<img src="'+esc(g.image)+'">':esc(g.emoji||"🎮"))+'</div><strong>'+esc(g.name)+'</strong><small>'+esc(g.visits||"Experience")+' visits</small></div>').join("")+'</div></section></div><div><section class="section"><div class="section-head"><h2>Friends</h2><button class="btn small ghost" onclick="go(\'friends\')">View all</button></div><div class="surface" style="padding:13px"><div class="friend-row">'+state.friends.slice(0,8).map(f=>'<div class="friend"><div class="face">'+(f.image?'<img src="'+esc(f.image)+'">':esc(f.emoji||"👤"))+'</div><small>'+esc(f.name)+'</small></div>').join("")+'</div></div></section><section class="section"><div class="section-head"><h2>Badges</h2><button class="btn small ghost" onclick="go(\'badges\')">View all</button></div><div class="surface" style="padding:12px"><div class="badge-row">'+state.badges.slice(0,6).map(b=>'<div class="badge-card"><div class="badge-icon">'+esc(b.emoji||"🏅")+'</div><small>'+esc(b.name)+'</small></div>').join("")+'</div></div></section><section class="section"><div class="section-head"><h2>Account stats</h2></div><div class="surface about">Demo currency: <b>'+fmt(state.coins)+'</b><br>Profile visits: <b>'+fmt(state.visits)+'</b><br><span class="subtle">Values are editable in Backstage and have no real-world value.</span></div></section></div></div>'}
function avatarView(){const list=state.inventory.filter(x=>avatarCategory==="All"||x.type.toLowerCase().includes(avatarCategory.toLowerCase()));return '<div class="page-title"><div><h1>Avatar Editor</h1><div class="subtle">Build a look with items in your simulator inventory</div></div></div><div class="avatar-editor"><div class="avatar-stage"><div class="big-avatar">'+avatarMarkup()+'</div><strong>'+esc(state.outfit||"Classic")+' outfit</strong><small>Preview avatar · simulated equipment</small></div><div class="surface editor-list"><h3>Wardrobe</h3><div class="tabs">'+["All","Hat","Shirt","Face","Accessory"].map(t=>'<button class="tab '+(avatarCategory===t?'active':'')+'" onclick="avatarCategory=\''+t+'\';render()">'+t+'</button>').join("")+'</div>'+(list.map(x=>'<div class="edit-row"><div class="item-image">'+(x.image?'<img src="'+esc(x.image)+'">':esc(x.emoji||"🎁"))+'</div><div class="detail"><strong>'+esc(x.name)+'</strong><small>'+esc(x.type||"Item")+'</small></div><label><input class="switch" type="checkbox" '+(x.equipped?'checked':'')+' onchange="toggleEquip(\''+esc(x.id)+'\',this.checked)"></label></div>').join("")||'<div class="empty">No matching items. Add items in Backstage.</div>')+'</div></div>'}
function toggleEquip(id,on){const x=state.inventory.find(i=>i.id===id);if(x)x.equipped=on;save();render()}
function catalogView(){return '<div class="page-title"><div><h1>Catalog</h1><div class="subtle">Find public community items by Roblox asset ID</div></div></div><div class="surface" style="padding:16px;margin-bottom:15px"><div class="toolbar"><input class="search" id="assetId" placeholder="Enter Roblox catalog asset ID"><button class="btn blue" onclick="lookupAsset()">Preview item</button></div><p class="hint">This uses public catalog thumbnails only. Add an item to your local simulator inventory; it does not purchase or grant the real item.</p><div id="assetResult"></div></div><div class="surface about">Tip: open a public Roblox catalog item and copy the numeric ID from its URL. You can add community-made items to your simulated inventory.</div>'}
function inventoryView(){const filtered=state.inventory.filter(x=>inventoryFilter==="All"||x.type.toLowerCase().includes(inventoryFilter.toLowerCase()));return '<div class="page-title"><div><h1>Inventory</h1><div class="subtle">'+state.inventory.length+' simulator items</div></div></div><div class="tabs">'+["All","Hat","Shirt","Face","Accessory","Effect"].map(t=>'<button class="tab '+(inventoryFilter===t?'active':'')+'" onclick="inventoryFilter=\''+t+'\';render()">'+t+'</button>').join("")+'</div><div class="items-grid">'+filtered.map(card).join("")+'</div><p class="hint">All items shown here are simulator props. They are not proof of Roblox ownership.</p>'}
function friendsView(){return '<div class="page-title"><div><h1>Friends</h1><div class="subtle">'+state.friends.length+' displayed friends</div></div></div><div class="mini-grid">'+state.friends.map(f=>'<div class="tile" style="text-align:center"><div class="thumb">'+(f.image?'<img src="'+esc(f.image)+'">':esc(f.emoji||"👤"))+'</div><strong>'+esc(f.name)+'</strong><small>Friend</small></div>').join("")+'</div>'}
function gamesView(){return '<div class="page-title"><div><h1>Creations</h1><div class="subtle">Experiences displayed on this profile</div></div></div><div class="mini-grid">'+state.games.map(g=>'<div class="tile"><div class="thumb">'+(g.image?'<img src="'+esc(g.image)+'">':esc(g.emoji||"🎮"))+'</div><strong>'+esc(g.name)+'</strong><small>'+esc(g.description||"Experience")+'</small><small>'+esc(g.visits||"0")+' visits</small></div>').join("")+'</div>'}
function badgesView(){return '<div class="page-title"><div><h1>Badges</h1><div class="subtle">'+state.badges.length+' displayed badges</div></div></div><div class="badge-row">'+state.badges.map(b=>'<div class="badge-card" style="width:110px;padding:16px 8px"><div class="badge-icon">'+esc(b.emoji||"🏅")+'</div><small>'+esc(b.name)+'</small></div>').join("")+'</div>'}
function render(){const map={profile:profileView,avatar:avatarView,catalog:catalogView,inventory:inventoryView,friends:friendsView,games:gamesView,badges:badgesView};$("view").innerHTML=(map[active]||profileView)();$("crumb").textContent="Profile / "+(navItems.find(x=>x[0]===active)?.[2]||"Overview")}
const backstageItems=[["profile","Profile"],["avatar","Avatar"],["inventory","Inventory"],["friends","Friends"],["games","Creations"],["badges","Badges"],["settings","Settings"]];
function openBackstage(tab){backstageTab=tab||"profile";renderBackstage();$("backdrop").classList.add("open");$("sheet").classList.add("open");document.body.style.overflow="hidden"}
function closeBackstage(){$("backdrop").classList.remove("open");$("sheet").classList.remove("open");document.body.style.overflow="";save()}
function renderBackstage(){$("sheetNav").innerHTML=backstageItems.map(t=>'<button class="'+(backstageTab===t[0]?'active':'')+'" onclick="backstageTab=\''+t[0]+'\';renderBackstage()">'+t[1]+'</button>').join("");let v="";
if(backstageTab==="profile")v='<h3>Profile & account</h3><div class="field"><label>DISPLAY NAME</label><input data-key="name" value="'+esc(state.name)+'"></div><div class="field"><label>USERNAME</label><input data-key="username" value="'+esc(state.username)+'"></div><div class="field"><label>BIO</label><textarea data-key="bio">'+esc(state.bio)+'</textarea></div><div class="field"><label>ABOUT</label><textarea data-key="about">'+esc(state.about)+' </textarea></div><div class="field-row"><div class="field"><label>FRIENDS COUNT</label><input data-key="friendsCount" type="number" value="'+state.friendsCount+'"></div><div class="field"><label>FOLLOWERS</label><input data-key="followers" type="number" value="'+state.followers+'"></div><div class="field"><label>FOLLOWING</label><input data-key="following" type="number" value="'+state.following+'"></div><div class="field"><label>PROFILE VISITS</label><input data-key="visits" type="number" value="'+state.visits+'"></div></div><div class="field"><label>DEMO COINS</label><input data-key="coins" type="number" value="'+state.coins+'"></div><div class="field"><label>PROFILE COVER IMAGE URL</label><input data-key="coverUrl" value="'+esc(state.coverUrl)+'" placeholder="https://…"></div><div class="field"><label>AVATAR IMAGE URL</label><input data-key="avatarUrl" value="'+esc(state.avatarUrl)+'" placeholder="https://…"></div><div class="field"><label>UPLOAD AVATAR IMAGE</label><input type="file" accept="image/*" onchange="uploadImage(this,\'avatarUrl\')"></div><div class="field"><label>UPLOAD COVER IMAGE</label><input type="file" accept="image/*" onchange="uploadImage(this,\'coverUrl\')"></div><div class="field"><label>PUBLIC ROBLOX USERNAME LOOKUP</label><div class="toolbar"><input id="lookupName" class="search" placeholder="Username only — never password"><button class="btn blue" onclick="importPublicProfile()">Import</button></div></div><p class="hint">Only public profile data and public avatar thumbnails are requested. No password, cookie, token or login is accepted.</p>';
if(backstageTab==="avatar")v='<h3>Avatar & outfit</h3><div class="field"><label>OUTFIT LABEL</label><input data-key="outfit" value="'+esc(state.outfit)+'"></div><div class="field"><label>AVATAR IMAGE URL</label><input data-key="avatarUrl" value="'+esc(state.avatarUrl)+'" placeholder="https://…"></div><div class="field"><label>UPLOAD AVATAR IMAGE</label><input type="file" accept="image/*" onchange="uploadImage(this,\'avatarUrl\')"></div><p class="hint">Equip or remove items in the Avatar tab. The rendered Roblox avatar image is a public thumbnail; local equipment toggles are only a visual simulator.</p><button class="btn" onclick="importWornAvatar()">Import currently worn public avatar items</button><div class="field"><label>QUICK OUTFIT PRESET</label><select id="outfitPreset" onchange="state.outfit=this.value;save()"><option>Classic</option><option>Streetwear</option><option>Space explorer</option><option>Blocky builder</option><option>Neon cyber</option></select></div>';
if(backstageTab==="inventory")v='<h3>Inventory items</h3><div class="field-row"><div class="field"><label>ITEM NAME</label><input id="newItemName" placeholder="e.g. Galaxy Crown"></div><div class="field"><label>ITEM TYPE</label><select id="newItemType"><option>Hat</option><option>Face Accessory</option><option>Shirt</option><option>Pants</option><option>Accessory</option><option>Effect</option><option>Collectible</option></select></div></div><div class="field-row"><div class="field"><label>EMOJI</label><input id="newItemEmoji" value="🎁"></div><div class="field"><label>IMAGE URL (OPTIONAL)</label><input id="newItemImage" placeholder="https://…"></div></div><div class="field"><label>ROBLOX ASSET ID (OPTIONAL)</label><input id="newItemAsset" placeholder="Numeric catalog ID"></div><button class="btn blue" onclick="addInventoryItem()">Add item</button><div style="margin-top:14px">'+state.inventory.map((x,i)=>'<div class="edit-row"><div class="item-image">'+(x.image?'<img src="'+esc(x.image)+'">':esc(x.emoji||"🎁"))+'</div><div class="detail"><strong>'+esc(x.name)+'</strong><small>'+esc(x.type)+'</small></div><button class="btn small ghost" onclick="deleteItem('+i+')">Remove</button></div>').join("")+'</div><button class="btn" onclick="importPublicCollectibles()">Import public collectibles (if visible)</button><p class="hint">Local demo inventory only. Items are not granted to any Roblox account.</p>';
if(backstageTab==="friends")v='<h3>Friends list</h3><div class="toolbar"><input id="newFriend" class="search" placeholder="Display name"><button class="btn blue" onclick="addFriend()">Add friend</button></div><button class="btn" onclick="importPublicFriends()">Import public friends (if visible)</button><div style="margin-top:12px">'+state.friends.map((x,i)=>'<div class="edit-row"><div class="item-image">'+esc(x.emoji||"👤")+'</div><div class="detail"><strong>'+esc(x.name)+'</strong><small>Displayed friend</small></div><button class="btn small ghost" onclick="removeFriend('+i+')">Remove</button></div>').join("")+'</div>';
if(backstageTab==="games")v='<h3>Displayed experiences</h3><div class="toolbar"><input id="newGame" class="search" placeholder="Experience name"><button class="btn blue" onclick="addGame()">Add</button></div><button class="btn" onclick="importPublicGames()">Import public creations (if visible)</button><div style="margin-top:12px">'+state.games.map((x,i)=>'<div class="edit-row"><div class="item-image">'+(x.image?'<img src="'+esc(x.image)+'">':esc(x.emoji||"🎮"))+'</div><div class="detail"><strong>'+esc(x.name)+'</strong><small>'+esc(x.description||"Experience")+'</small></div><button class="btn small ghost" onclick="removeGame('+i+')">Remove</button></div>').join("")+'</div>';
if(backstageTab==="badges")v='<h3>Badges</h3><div class="toolbar"><input id="newBadge" class="search" placeholder="Badge name"><button class="btn blue" onclick="addBadge()">Add badge</button></div><div style="margin-top:12px">'+state.badges.map((x,i)=>'<div class="edit-row"><div class="item-image">'+esc(x.emoji||"🏅")+'</div><div class="detail"><strong>'+esc(x.name)+'</strong><small>Displayed badge</small></div><button class="btn small ghost" onclick="state.badges.splice('+i+',1);save();renderBackstage()">Remove</button></div>').join("")+'</div>';
if(backstageTab==="settings")v='<h3>Simulator settings</h3><p class="hint">Your edits are stored in this browser on this device.</p><button class="btn" onclick="exportProfile()">Export profile JSON</button> <button class="btn" onclick="document.getElementById(\'importJson\').click()">Import profile JSON</button><input id="importJson" class="hidden" type="file" accept="application/json" onchange="importProfileFile(this)"><hr style="border:0;border-top:1px solid #ffffff16;margin:18px 0"><button class="btn" onclick="resetProfile()">Reset simulator data</button><p class="hint">This is an unofficial simulator for entertainment and UI testing. It cannot change Roblox accounts, items, Robux or balances.</p>';
$("sheetContent").innerHTML=v}
$("sheetContent").addEventListener("input",e=>{const k=e.target.dataset.key;if(!k)return;state[k]=["coins","followers","following","friendsCount","visits"].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();if(k==="name"||k==="username"||k==="bio"||k==="avatarUrl"||k==="coverUrl"||k==="coins"||k==="followers"||k==="friendsCount")render()});
$("sheetContent").addEventListener("change",e=>{const k=e.target.dataset.key;if(k){state[k]=["coins","followers","following","friendsCount","visits"].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();render()}});
function uploadImage(input,key){const f=input.files?.[0];if(!f)return;if(f.size>1800000)return toast("Choose an image under 1.8 MB");const r=new FileReader();r.onload=()=>{state[key]=r.result;save();render();renderBackstage();toast("Image saved locally")};r.readAsDataURL(f)}
function addInventoryItem(){const name=$("newItemName").value.trim();if(!name)return toast("Enter an item name");state.inventory.unshift({id:"custom-"+Date.now(),name,type:$("newItemType").value,emoji:$("newItemEmoji").value||"🎁",image:$("newItemImage").value||"",assetId:$("newItemAsset").value||"",equipped:false});save();renderBackstage();render();toast("Added to simulator inventory")}
function deleteItem(i){state.inventory.splice(i,1);save();renderBackstage();render()}
function addFriend(){const n=$("newFriend").value.trim();if(!n)return toast("Enter a friend name");state.friends.push({name:n,emoji:"👤"});state.friendsCount=Math.max(state.friendsCount,state.friends.length);save();renderBackstage();render()}
function removeFriend(i){state.friends.splice(i,1);state.friendsCount=Math.max(0,state.friendsCount-1);save();renderBackstage();render()}
function addGame(){const n=$("newGame").value.trim();if(!n)return toast("Enter an experience name");state.games.push({name:n,emoji:"🎮",visits:"0"});save();renderBackstage();render()}
function removeGame(i){state.games.splice(i,1);save();renderBackstage();render()}
function addBadge(){const n=$("newBadge").value.trim();if(!n)return toast("Enter a badge name");state.badges.push({name:n,emoji:"🏅"});save();renderBackstage();render()}
async function importPublicProfile(){const name=$("lookupName").value.trim();if(!name)return toast("Enter a public username");toast("Looking up public Roblox profile…");try{const r=await fetch("https://users.roblox.com/v1/usernames/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usernames:[name],excludeBannedUsers:true})});if(!r.ok)throw Error("Username lookup unavailable");const d=await r.json();if(!d.data?.length)throw Error("User not found");const u=d.data[0];state.userId=u.id;state.username=u.name;state.name=u.displayName||u.name;const tasks=await Promise.allSettled([fetch("https://thumbnails.roblox.com/v1/users/avatar?userIds="+u.id+"&size=420x420&format=Png&isCircular=false").then(x=>x.json()),fetch("https://friends.roblox.com/v1/users/"+u.id+"/followers/count").then(x=>x.json()),fetch("https://friends.roblox.com/v1/users/"+u.id+"/friends/count").then(x=>x.json()),fetch("https://users.roblox.com/v1/users/"+u.id).then(x=>x.json())]);if(tasks[0].status==="fulfilled"&&tasks[0].value.data?.[0]?.imageUrl)state.avatarUrl=tasks[0].value.data[0].imageUrl;if(tasks[1].status==="fulfilled")state.followers=tasks[1].value.count||state.followers;if(tasks[2].status==="fulfilled")state.friendsCount=tasks[2].value.count||state.friendsCount;if(tasks[3].status==="fulfilled"&&tasks[3].value.description)state.about=tasks[3].value.description;save();render();renderBackstage();toast("Public profile imported")}catch(e){toast(e.message+" — try again or use a manual avatar image")}}
async function importPublicFriends(){if(!state.userId)return toast("Import a public username first");try{const r=await fetch("https://friends.roblox.com/v1/users/"+state.userId+"/friends");if(!r.ok)throw Error("Friends list is private or unavailable");const d=await r.json();state.friends=(d.data||[]).slice(0,60).map(x=>({name:x.displayName||x.name,emoji:"👤",userId:x.id}));save();renderBackstage();render();toast("Imported "+state.friends.length+" public friends")}catch(e){toast(e.message)}}
async function importPublicGames(){if(!state.userId)return toast("Import a public username first");try{const r=await fetch("https://games.roblox.com/v2/users/"+state.userId+"/games?accessFilter=Public&limit=50&sortOrder=Asc");if(!r.ok)throw Error("Public creations unavailable");const d=await r.json();state.games=(d.data||[]).slice(0,30).map(g=>({name:g.name,description:g.description||"Roblox experience",emoji:"🎮",visits:fmt(g.placeVisits||0),universeId:g.id}));const ids=state.games.map(x=>x.universeId).filter(Boolean);if(ids.length){const t=await fetch("https://thumbnails.roblox.com/v1/games/icons?universeIds="+ids.join(",")+"&size=256x256&format=Png&isCircular=false").then(x=>x.json());for(const im of t.data||[]){const g=state.games.find(x=>x.universeId===im.targetId);if(g)g.image=im.imageUrl}}save();renderBackstage();render();toast("Imported public creations")}catch(e){toast(e.message)}}
async function importWornAvatar(){if(!state.userId)return toast("Import a public username first");try{const r=await fetch("https://avatar.roblox.com/v1/users/"+state.userId+"/avatar");if(!r.ok)throw Error("Public avatar data unavailable");const d=await r.json();const assets=d.assets||[];const ids=assets.map(a=>a.id).filter(Boolean);let thumbs={};if(ids.length){const t=await fetch("https://thumbnails.roblox.com/v1/assets?assetIds="+ids.join(",")+"&size=150x150&format=Png").then(x=>x.json());for(const im of t.data||[])thumbs[im.targetId]=im.imageUrl}for(const a of assets){if(state.inventory.some(x=>String(x.assetId)===String(a.id)))continue;state.inventory.push({id:"worn-"+a.id,name:a.name||("Avatar item "+a.id),type:a.assetType?.name||"Avatar item",emoji:"🎁",image:thumbs[a.id]||"",assetId:String(a.id),equipped:true})}save();renderBackstage();render();toast("Imported "+assets.length+" worn avatar items")}catch(e){toast(e.message)}}
async function importPublicCollectibles(){if(!state.userId)return toast("Import a public username first");try{const r=await fetch("https://inventory.roblox.com/v1/users/"+state.userId+"/assets/collectibles?limit=100&sortOrder=Desc");if(!r.ok)throw Error("Collectibles are private or unavailable");const d=await r.json();const assets=d.data||[];for(const a of assets){if(state.inventory.some(x=>String(x.assetId)===String(a.assetId)))continue;state.inventory.push({id:"collectible-"+a.assetId,name:a.name||("Collectible "+a.assetId),type:"Collectible",emoji:"💎",image:"",assetId:String(a.assetId),equipped:false})}save();renderBackstage();render();toast("Imported "+assets.length+" public collectibles")}catch(e){toast(e.message)}}
async function lookupAsset(){const id=$("assetId").value.trim();if(!/^\d+$/.test(id))return toast("Enter a numeric asset ID");const box=$("assetResult");box.innerHTML='<p class="hint">Loading public item thumbnail…</p>';try{const r=await fetch("https://thumbnails.roblox.com/v1/assets?assetIds="+id+"&size=420x420&format=Png");if(!r.ok)throw Error("Thumbnail unavailable");const d=await r.json();const image=d.data?.[0]?.imageUrl;if(!image)throw Error("No public thumbnail found");box.innerHTML='<div class="edit-row"><div class="item-image"><img src="'+esc(image)+'"></div><div class="detail"><strong>Catalog item #'+esc(id)+'</strong><small>Public asset thumbnail</small></div><button class="btn blue" onclick="addCatalogAsset(\''+esc(id)+'\',\''+esc(image)+'\')">Add to inventory</button></div>'}catch(e){box.innerHTML='<p class="hint">'+esc(e.message)+'</p>'}}
function addCatalogAsset(id,image){state.inventory.unshift({id:"asset-"+id,name:"Catalog item "+id,type:"Community item",emoji:"🎁",image,assetId:id,equipped:false});save();toast("Added catalog item to local inventory")}
function exportProfile(){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.href=u;a.download="larpblox-profile.json";a.click();URL.revokeObjectURL(u)}
function importProfileFile(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);state={...defaults,...d};save();render();renderBackstage();toast("Profile imported")}catch{toast("Invalid profile JSON")}};r.readAsText(f)}
function resetProfile(){if(!confirm("Reset all LarpBlox simulator data on this device?"))return;localStorage.removeItem("larpblox-v3");state={...defaults,inventory:defaults.inventory.map(x=>({...x})),friends:defaults.friends.map(x=>({...x})),games:defaults.games.map(x=>({...x})),badges:defaults.badges.map(x=>({...x}))};save();go("profile");renderBackstage();toast("Simulator reset")}
let holdTimer=null,holding=false;
const topHold=$("topHold"),holdFill=$("holdFill");
topHold.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;holding=true;topHold.classList.add("charging");holdFill.style.transition="width .95s linear";requestAnimationFrame(()=>holdFill.style.width="100%");holdTimer=setTimeout(()=>{if(holding){holding=false;topHold.classList.remove("charging");holdFill.style.transition="none";holdFill.style.width="0";openBackstage();if(navigator.vibrate)navigator.vibrate(12)}},950)});
function cancelHold(){holding=false;clearTimeout(holdTimer);topHold.classList.remove("charging");holdFill.style.transition="width .12s linear";holdFill.style.width="0"}
topHold.addEventListener("pointerup",cancelHold);topHold.addEventListener("pointercancel",cancelHold);topHold.addEventListener("pointerleave",cancelHold);topHold.addEventListener("contextmenu",e=>e.preventDefault());
renderNav();render();save();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
