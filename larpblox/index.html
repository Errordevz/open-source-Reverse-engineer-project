<body>
<div class="top-edge" id="topEdge" aria-label="Hold top edge to open Backstage"><div class="hold-track"><div class="hold-fill" id="holdFill"></div></div></div>
<div class="app">
<header class="header"><div class="logo"><span class="logo-mark">◈</span><span>LarpBlox</span></div><button class="header-link" onclick="go('home')">Discover</button><button class="header-link" onclick="go('catalog')">Catalog</button><button class="header-link" onclick="go('avatar')">Avatar</button><button class="header-link" onclick="go('friends')">Friends</button><button class="header-link" onclick="go('profile')">Profile</button><span class="header-spacer"></span><button class="wallet-chip" onclick="go('catalog')"><span>R$</span><strong id="headerCoins">1,250</strong><small>DEMO</small></button><span class="sim-chip">SIMULATOR</span></header>
<div class="shell"><main class="page" id="page"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div class="watermark">SIMULATOR · NOT ROBLOX</div>
<div class="backdrop" id="backdrop" onclick="closeBackstage()"></div>
<section class="sheet" id="sheet" aria-label="Backstage editor">
<header class="sheet-head"><strong>⚙ Backstage</strong><span class="save-state" id="saveState">● Saved locally</span><button class="sheet-close" onclick="closeBackstage()">Done ✕</button></header>
<div class="sheet-body"><nav class="sheet-nav" id="sheetNav"></nav><div class="sheet-content" id="sheetContent"></div></div>
</section>
<div class="toast hidden" id="toast"></div>
<script>
const KEY='larpblox-v3';
const defaults={
 displayName:'Player One',username:'player_one',bio:'Welcome to my profile!',about:'',avatarUrl:'',coverUrl:'',userId:null,
 friendsCount:48,followers:1240,following:85,coins:1250,outfit:'Classic',verified:false,premium:false,
 avatarStyle:{skin:'#e8b98d',shirt:'#4777d9',pants:'#344b82',face:'🙂',scale:100},savedOutfits:[],
 inventory:[
  {id:'asset-93876979367445',name:'Cute black jumping spider',type:'Accessories',image:'https://tr.rbxcdn.com/180DAY-4189d1ed2757dfea3fcb00e2a91da462/420/420/Hat/Png/noFilter',assetId:'93876979367445',price:95,creator:'Powerful artists',equipped:true},
  {id:'asset-77745503037034',name:'Golden divine celestial halo',type:'Accessories',image:'https://tr.rbxcdn.com/180DAY-63d05048c4bd375bd532be5e54609d9a/420/420/Hat/Png/noFilter',assetId:'77745503037034',price:95,creator:'Powerful artists',equipped:false},
  {id:'asset-123578458711518',name:'Golden ice crystal wings',type:'Accessories',image:'https://tr.rbxcdn.com/180DAY-9d11dfc6186b6c1734aeab9b4b7f9596/420/420/BackAccessory/Png/noFilter',assetId:'123578458711518',price:140,creator:'Powerful artists',equipped:false},
  {id:'asset-114241510292784',name:'Y2K blue jean cap',type:'Accessories',image:'https://tr.rbxcdn.com/180DAY-2631676c7da1d35ba2b632dae829be29/420/420/Hat/Png/noFilter',assetId:'114241510292784',price:105,creator:'Powerful artists',equipped:true}
 ],
 friends:[{name:'BuilderKai',emoji:'🧑‍🔧'},{name:'PixelMia',emoji:'👩‍🎨'},{name:'NovaPlays',emoji:'🧑‍🚀'},{name:'BlockyBen',emoji:'🧑‍💻'}],
 games:[],
 badges:[{name:'Welcome!',emoji:'👋'},{name:'Explorer',emoji:'🧭'},{name:'Builder',emoji:'🛠️'}],
 favorites:[{name:'Natural Disaster Survival',emoji:'🌪️'},{name:'Brookhaven RP',emoji:'🏡'},{name:'Tower of Hell',emoji:'🗼'}]
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');const migrated={...clone(defaults),...old};if(!old.displayName&&old.name)migrated.displayName=old.name;if(!old.outfit)migrated.outfit='Classic';migrated.inventory=Array.isArray(old.inventory)?old.inventory:clone(defaults.inventory);migrated.friends=Array.isArray(old.friends)?old.friends:clone(defaults.friends);migrated.games=Array.isArray(old.games)?old.games:clone(defaults.games);migrated.badges=Array.isArray(old.badges)?old.badges:clone(defaults.badges);migrated.favorites=Array.isArray(old.favorites)?old.favorites:clone(defaults.favorites);migrated.avatarStyle={...clone(defaults.avatarStyle),...(old.avatarStyle||{})};migrated.savedOutfits=Array.isArray(old.savedOutfits)?old.savedOutfits:[];return migrated}catch{return clone(defaults)}}
let state=loadState(),activeTab='About',activePage='home',backstageTab='profile',filter='All',query='';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){return Number(v||0).toLocaleString('en-US')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveState').textContent='● Saved locally';$('saveState').style.color='#159b69'}catch{$('saveState').textContent='Storage full';$('saveState').style.color='#bd4a3b'}}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function avatar(){return state.avatarUrl?'<img src="'+esc(state.avatarUrl)+'" alt="Profile avatar">':'🧑‍🚀'}
function art(item){return item.image?'<img src="'+esc(item.image)+'" alt="">':esc(item.emoji||'🎁')}
function go(page){activePage=page;render()}
function setTab(tab){activeTab=tab;render()}
function stat(label,value){return '<div class="stat"><strong>'+fmt(value)+'</strong><span>'+label+'</span></div>'}
function section(title,body,action){return '<section class="section"><div class="section-title"><h2>'+title+'</h2>'+(action||'')+'</div>'+body+'</section>'}
function profileHeader(){const identity=(state.verified?'<span class="identity-badge">✓ Verified</span>':'')+(state.premium?'<span class="identity-badge premium">✦ Premium</span>':'');return '<div class="profile-banner">'+(state.coverUrl?'<img src="'+esc(state.coverUrl)+'" alt="">':'')+'</div><div class="profile-head"><div class="avatar">'+avatar()+'</div><div class="profile-details"><div class="display-name">'+esc(state.displayName)+'</div><div class="username">@'+esc(state.username)+(state.userId?' · '+state.userId:'')+'</div><div class="identity-badges">'+identity+'</div><div class="bio">'+esc(state.bio)+'</div></div><div class="profile-actions"><button class="btn primary" onclick="toast(\'Follow is a local demo action\')">＋ Follow</button><button class="btn" onclick="toast(\'Demo profile · no messages are sent\')">Message</button></div></div><div class="stats">'+stat('Friends',state.friendsCount)+stat('Followers',state.followers)+stat('Following',state.following)+stat('Demo Robux',state.coins)+'</div>'}
function friendStrip(){return '<div class="horizontal">'+state.friends.slice(0,24).map(f=>'<div class="friend"><div class="friend-pic">'+(f.image?'<img src="'+esc(f.image)+'" alt="">':esc(f.emoji||'👤'))+'</div><small>'+esc(f.name)+'</small></div>').join('')+'</div>'}
function itemGrid(items,controls=false){return '<div class="item-grid">'+items.map(i=>'<article class="item"><div class="item-art">'+art(i)+'</div><strong>'+esc(i.name)+'</strong><small>'+esc(i.type||'Item')+'</small>'+(i.equipped?'<span class="pill">Wearing</span>':'')+(controls?'<button class="btn small" style="margin-top:8px;width:100%" onclick="toggleEquip(\''+esc(i.id)+'\')">'+(i.equipped?'Take off':'Wear')+'</button>':'')+'</article>').join('')+'</div>'}
function badgeStrip(){return '<div class="horizontal">'+state.badges.map(b=>'<div class="friend"><div class="friend-pic">'+esc(b.emoji||'🏅')+'</div><small>'+esc(b.name)+'</small></div>').join('')+'</div>'}
function gameGrid(items){return '<div class="item-grid">'+items.map(g=>'<article class="item"><div class="item-art">'+(g.image?'<img src="'+esc(g.image)+'" alt="">':esc(g.emoji||'🎮'))+'</div><strong>'+esc(g.name)+'</strong><small>'+esc(g.description||'Experience')+'</small><small>'+esc(g.visits||'0')+' visits</small></article>').join('')+'</div>'}
function aboutView(){return section('About','<div class="about-card">'+esc(state.about||'This player has not added an about description yet.')+'</div>')+section('Friends','<div class="subtle" style="margin-bottom:10px">'+fmt(state.friendsCount)+' friends</div>'+friendStrip(),'<button onclick="go(\'friends\')">See all</button>')+section('Currently Wearing',itemGrid(state.inventory.filter(x=>x.equipped).slice(0,8)),'<button onclick="go(\'avatar\')">Edit avatar</button>')+section('Creations',gameGrid(state.games.slice(0,4)),'<button onclick="go(\'creations\')">See all</button>')+section('Badges',badgeStrip(),'<button onclick="go(\'badges\')">See all</button>')}
function inventoryView(){const types=['All','Accessories','Clothing','Gear','Collectibles'];const list=state.inventory.filter(x=>(filter==='All'||x.type===filter)&&(!query||x.name.toLowerCase().includes(query.toLowerCase())));return '<div class="content"><div class="section-title"><div><h2>Inventory</h2><div class="subtle">'+state.inventory.length+' displayed items</div></div></div><div class="inventory-toolbar"><input class="search" placeholder="Search inventory" value="'+esc(query)+'" oninput="filterInventory(this.value)"><button class="btn" onclick="openBackstage(\'inventory\')">＋ Add item</button></div><div class="filter-row">'+types.map(t=>'<button class="filter '+(filter===t?'active':'')+'" onclick="filter=\''+t+'\';render()">'+t+'</button>').join('')+'</div>'+(list.length?itemGrid(list,true):'<div class="empty">No items match this filter.</div>')+'</div>'}
function avatarView(){
 const a=state.avatarStyle||defaults.avatarStyle;
 const equipped=state.inventory.filter(x=>x.equipped);
 const outfits=state.savedOutfits||[];
 const preview=state.avatarUrl
  ? '<img src="'+esc(state.avatarUrl)+'" alt="Avatar preview" style="width:180px;height:220px;object-fit:contain">'
  : '<div class="avatar-figure" style="transform:scale('+(Math.max(80,Math.min(120,Number(a.scale)||100))/100)+')"><div class="head" style="background:'+esc(a.skin)+'">'+esc(a.face||'🙂')+'</div><div class="torso" style="background:'+esc(a.shirt)+'"></div><div class="legs"><span style="background:'+esc(a.pants)+'"></span><span style="background:'+esc(a.pants)+'"></span></div></div>';
 return '<div class="content"><div class="section-title"><div><h2>Avatar editor</h2><div class="subtle">Customize your local avatar, equip catalog finds and save outfit presets</div></div><button class="btn" onclick="openBackstage(\'outfits\')">Outfits</button></div><div class="avatar-layout"><div class="avatar-stage">'+preview+'<div class="avatar-caption">'+esc(state.displayName)+'</div><div class="avatar-sub">'+esc(state.outfit||'Classic outfit')+'</div><span class="catalog-live-tag">LOCAL AVATAR PREVIEW</span></div><div class="editor-panel"><h3>Appearance</h3><div class="avatar-customizer"><div class="avatar-control"><label>SKIN TONE</label><input type="color" value="'+esc(a.skin)+'" onchange="setAvatarStyleV5(\'skin\',this.value)"></div><div class="avatar-control"><label>SHIRT COLOR</label><input type="color" value="'+esc(a.shirt)+'" onchange="setAvatarStyleV5(\'shirt\',this.value)"></div><div class="avatar-control"><label>PANTS COLOR</label><input type="color" value="'+esc(a.pants)+'" onchange="setAvatarStyleV5(\'pants\',this.value)"></div><div class="avatar-control"><label>FACE</label><select onchange="setAvatarStyleV5(\'face\',this.value)">'+['🙂','😎','😐','😄','😈','🥺','🤖','😴'].map(x=>'<option '+(a.face===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="avatar-control" style="grid-column:1/-1"><label>BODY SCALE · '+(Number(a.scale)||100)+'%</label><input type="range" min="80" max="120" step="5" value="'+(Number(a.scale)||100)+'" oninput="setAvatarStyleV5(\'scale\',this.value,false)" onchange="setAvatarStyleV5(\'scale\',this.value,true)"></div></div><div class="avatar-actions"><button class="btn" onclick="resetAvatarStyleV5()">Reset appearance</button><button class="btn primary" onclick="openBackstage(\'outfits\')">Save outfit</button></div><hr class="catalog-divider"><h3>Wearing now · '+equipped.length+'</h3>'+(equipped.map(x=>'<div class="edit-item"><div class="item-art">'+art(x)+'</div><div class="edit-meta"><strong>'+esc(x.name)+'</strong><small>'+esc(x.type)+'</small></div><button class="btn small" onclick="toggleEquip(\''+esc(x.id)+'\')">Remove</button></div>').join('')||'<div class="empty">Nothing equipped yet.</div>')+'<p class="hint">Try on catalog items or toggle them in Inventory. The avatar preview and outfit presets are stored locally; no Roblox avatar is changed.</p><button class="btn primary" onclick="go(\'inventory\')">Browse inventory</button></div></div><section class="discover-section"><div class="discover-section-head"><div><h2>Saved outfits</h2><p>Load a previous look in one tap</p></div></div>'+(outfits.length?outfits.map(outfitCardV5).join(''):'<div class="empty">No saved outfits yet. Customize your look and save one.</div>')+'</section></div>';
}
function friendsView(){return '<div class="content"><div class="section-title"><div><h2>Friends</h2><div class="subtle">'+state.friends.length+' displayed profiles · '+fmt(state.friendsCount)+' total count</div></div><button class="btn" onclick="openBackstage(\'friends\')">Manage</button></div>'+(state.friends.length?'<div class="item-grid">'+state.friends.map(f=>'<article class="item"><div class="item-art">'+(f.image?'<img src="'+esc(f.image)+'">':esc(f.emoji||'👤'))+'</div><strong>'+esc(f.name)+'</strong><small>Friend</small></article>').join('')+'</div>':'<div class="empty">No friends added.</div>')+'</div>'}
function creationsView(){return '<div class="content"><div class="section-title"><div><h2>Creations</h2><div class="subtle">Experiences shown on this profile</div></div><button class="btn" onclick="openBackstage(\'games\')">Manage</button></div>'+(state.games.length?gameGrid(state.games):'<div class="empty">No creations added.</div>')+'</div>'}
function badgesView(){return '<div class="content"><div class="section-title"><div><h2>Badges</h2><div class="subtle">'+state.badges.length+' displayed badges</div></div><button class="btn" onclick="openBackstage(\'badges\')">Manage</button></div><div class="horizontal">'+state.badges.map(b=>'<div class="friend"><div class="friend-pic">'+esc(b.emoji||'🏅')+'</div><small>'+esc(b.name)+'</small></div>').join('')+'</div></div>'}
function favoritesView(){return '<div class="content"><div class="section-title"><div><h2>Favorites</h2><div class="subtle">Experiences this profile likes</div></div><button class="btn" onclick="importPublicFavorites()">Import public favorites</button></div>'+(state.favorites.length?gameGrid(state.favorites):'<div class="empty">No favorites added.</div>')+'<p class="hint">Public favorites import only works when Roblox exposes the list.</p></div>'}
function render(){
const tabs=['About','Creations','Favorites','Inventory','Badges'];let body='';
if(activePage==='home')body=discoverV4();
else if(activePage==='avatar')body=avatarView();
else if(activePage==='catalog')body=catalogV4View();
else if(activePage==='friends')body=friendsView();
else if(activePage==='inventory')body=inventoryView();
else if(activePage==='creations')body=creationsView();
else if(activePage==='badges')body=badgesView();
else if(activeTab==='Creations')body=creationsView();
else if(activeTab==='Favorites')body=favoritesView();
else if(activeTab==='Inventory')body=inventoryView();
else if(activeTab==='Badges')body=badgesView();
else body='<div class="content">'+aboutView()+'</div>';
const shell=activePage==='profile'?profileHeader()+'<nav class="tabs">'+tabs.map(t=>'<button class="tab '+(activeTab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('')+'</nav>':'';
$('page').innerHTML=shell+body;
$('mobileNav').innerHTML=[['home','⌂','Home'],['catalog','▦','Catalog'],['avatar','◉','Avatar'],['profile','◎','Profile'],['inventory','▤','Inventory']].map(x=>'<button class="'+(activePage===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>').join('');
const coins=$('headerCoins');if(coins)coins.textContent=fmt(state.coins);

}
function toggleEquip(id){const item=state.inventory.find(x=>String(x.id)===String(id));if(!item)return;item.equipped=!item.equipped;save();render()}
function filterInventory(value){query=value;render();const input=document.querySelector('.inventory-toolbar .search');if(input){input.focus();input.setSelectionRange(query.length,query.length)}}
const backstageItems=[['profile','Profile'],['identity','Identity'],['avatar','Avatar'],['outfits','Outfits'],['inventory','Inventory'],['friends','Friends'],['games','Creations'],['badges','Badges'],['settings','Settings']];
function openBackstage(tab){backstageTab=tab||'profile';renderBackstage();$('backdrop').classList.add('open');$('sheet').classList.add('open');document.body.style.overflow='hidden'}
function closeBackstage(){$('backdrop').classList.remove('open');$('sheet').classList.remove('open');document.body.style.overflow='';save();render()}
function renderBackstage(){

function setAvatarStyleV5(key,value,shouldRender=true){
 const allowed=['skin','shirt','pants','face','scale'];
 if(!allowed.includes(key))return;

 state.avatarStyle[key]=key==='scale'?Math.max(80,Math.min(120,Number(value)||100)):String(value);

}

function outfitCardV5(o){return '<div class="outfit-row"><div class="outfit-preview" style="background:linear-gradient(135deg,'+esc(o.style?.shirt||'#4777d9')+' 0 50%,'+esc(o.style?.pants||'#344b82')+' 50% 100%)"></div><div><strong>'+esc(o.name||'Saved outfit')+'</strong><small>'+(o.equipped||[]).length+' equipped items · local preset</small></div><button class="btn small" onclick="applyOutfitV5(\''+o.id+'\')">Wear</button><button class="btn small" onclick="removeOutfitV5(\''+o.id+'\')">Delete</button></div>'}
function saveOutfitV5(){
 const name=$('outfitNameInput')?.value.trim()||('Outfit '+((state.savedOutfits||[]).length+1));
 state.savedOutfits=state.savedOutfits||[];
 state.savedOutfits.unshift({id:String(Date.now()),name,style:clone(state.avatarStyle||defaults.avatarStyle),equipped:state.inventory.filter(x=>x.equipped).map(x=>String(x.id))});
 state.outfit=name;save();render();renderBackstage();toast('Outfit saved locally');
}
function applyOutfitV5(id){
 const outfit=(state.savedOutfits||[]).find(x=>String(x.id)===String(id));if(!outfit)return;
 state.avatarStyle={...clone(defaults.avatarStyle),...(outfit.style||{})};
 const equipped=new Set((outfit.equipped||[]).map(String));
 state.inventory.forEach(x=>x.equipped=equipped.has(String(x.id)));
 state.outfit=outfit.name||'Saved outfit';save();render();renderBackstage();toast('Outfit applied');
}
function removeOutfitV5(id){state.savedOutfits=(state.savedOutfits||[]).filter(x=>String(x.id)!==String(id));save();render();renderBackstage()}

async function lookupAsset(){
 const id=$('assetId').value.trim();
 if(!/^\d+$/.test(id))return toast('Enter a numeric asset ID');
 const box=$('assetResult');box.innerHTML='<p class="hint">Loading public Roblox item details…</p>';
 try{
  if(!window.larpApi)throw new Error('Public data service is still starting');
  const response=await window.larpApi.get('/api/asset/'+id);
  const item=response.data;
  window.larpAssetLookup=item;
  box.innerHTML='<div class="edit-item"><div class="item-art">'+(item.image?'<img src="'+esc(item.image)+'">':'🎁')+'</div><div class="edit-meta"><strong>'+esc(item.name||('Catalog item #'+id))+'</strong><small>'+esc(item.creator||'Roblox creator')+' · '+(item.price==null?'Off sale':fmt(item.price)+' R$')+'</small></div><button class="btn primary" onclick="addCatalogAsset(\''+esc(id)+'\',\''+esc(item.image||'')+'\')">Add to inventory</button></div>';
 }catch(error){box.innerHTML='<p class="hint">'+esc(error.message)+'</p>'}
}
function addCatalogAsset(id,image){state.inventory.unshift({id:'asset-'+id,name:'Catalog item '+id,type:'Accessories',emoji:'🎁',image,assetId:id,equipped:false});save();render();toast('Added to local simulator inventory')}
async function importPublicProfile(){
 const name=$('lookupName').value.trim();if(!name)return toast('Enter a public username');
 toast('Looking up public Roblox profile…');
 try{
  if(!window.larpApi)throw new Error('Public data service is still starting');
  const response=await window.larpApi.post('/api/roblox/profile',{username:name});
  const user=response.data;
  state.userId=user.id;state.username=user.username;state.displayName=user.displayName||user.username;
  if(user.avatarUrl)state.avatarUrl=user.avatarUrl;
  if(Number.isFinite(user.followers))state.followers=user.followers;
  if(Number.isFinite(user.friendsCount))state.friendsCount=user.friendsCount;
  if(user.description)state.about=user.description;
  save();render();renderBackstage();toast('Public profile imported');
 }catch(error){toast(error.message+' · try again or add an image manually')}
}

}

async function importWornAvatar(){
 if(!state.userId)return toast('Import a public username first');
 try{
  if(!window.larpApi)throw new Error('Public data service is still starting');
  const response=await window.larpApi.get('/api/roblox/worn?userId='+encodeURIComponent(state.userId));
  const assets=response.data.assets||[];
  for(const asset of assets){if(state.inventory.some(x=>String(x.assetId)===String(asset.id)))continue;state.inventory.push({id:'worn-'+asset.id,name:asset.name||('Avatar item '+asset.id),type:'Accessories',image:asset.image||'',assetId:String(asset.id),equipped:true})}
  save();renderBackstage();render();toast('Imported '+assets.length+' worn items');
 }catch(error){toast(error.message)}
}

function discoverV4(){return '<div class="content discover-page"><div class="discover-head"><div><div class="eyebrow">ROBLOX UNIVERSE · SIMULATOR</div><h1>Discover</h1><p>Games, avatar finds and creator drops.</p></div><div class="discover-wallet"><strong>R$ '+fmt(state.coins)+'</strong><small>DEMO BALANCE ONLY</small></div></div><div class="profile-searchbar"><input id="homeUsername" placeholder="Find a public Roblox username" onkeydown="if(event.key===\'Enter\')lookupHomeV4()"><button onclick="lookupHomeV4()">COPY USER</button></div><section class="discover-hero"><div class="discover-hero-copy"><div class="eyebrow">YOUR NEXT LOOK STARTS HERE</div><h2>Find the item. Build the fit.</h2><p>Browse real public catalog listings, try pieces on locally and save a demo outfit.</p><button onclick="go(\'catalog\')">Explore catalog →</button></div><img class="discover-hero-art" src="'+CREATOR_ITEMS[2].image+'" alt="Golden ice crystal wings"></section><section class="discover-section"><div class="discover-section-head"><div><h2>Quick style search</h2><p>Search this public Roblox catalog shelf</p></div></div><div class="style-chips"><button onclick="catalogQuickV4(\'Y2K\')">✦ Y2K</button><button onclick="catalogQuickV4(\'streetwear hat\')">Streetwear</button><button onclick="catalogQuickV4(\'halo\')">Halos</button><button onclick="catalogQuickV4(\'spider\')">Cute UGC</button><button onclick="catalogQuickV4(\'wings\')">Wings</button></div></section><section class="discover-section"><div class="discover-section-head"><div><h2>Trending experiences</h2><p>Featured public Roblox experiences</p></div></div><div class="game-grid" id="discoverGameGrid">'+FEATURED_GAMES.map(gameCardV4).join('')+'</div></section><section class="discover-section"><div class="discover-section-head"><div><h2>TikTok-linked UGC picks</h2><p>Creator posts linked to their real catalog listings</p></div><button onclick="go(\'catalog\')">See all</button></div><div class="ugc-grid">'+CREATOR_ITEMS.map(creatorCardV4).join('')+'</div></section><p class="hint">Independent simulator. Public Roblox thumbnails are linked to their original catalog pages; demo actions never buy or grant Roblox items.</p></div>'}
function lookupHomeV4(){const name=$('homeUsername')?.value.trim();if(!name)return toast('Enter a public username');openBackstage('identity');window.setTimeout(()=>{const field=$('lookupName');if(field){field.value=name;importPublicProfile()}},100)}

function catalogCardV4(x){return '<article class="catalog-item-card"><div class="catalog-item-art"><img loading="lazy" src="'+esc(x.image||'')+'" alt="'+esc(x.name)+'"></div><div class="catalog-item-meta"><strong>'+esc(x.name)+'</strong><small>by '+esc(x.creator||'Roblox creator')+'</small><small class="ugc-price">'+(x.price==null?'Off sale':fmt(x.price)+' R$')+'</small><div class="catalog-item-actions"><button onclick="tryCatalogV4(\''+x.assetId+'\')">Try on</button><button class="primary" onclick="buyCatalogV4(\''+x.assetId+'\')">Buy · Demo</button></div><a class="catalog-link" href="https://www.roblox.com/catalog/'+x.assetId+'" target="_blank" rel="noopener">Open Roblox listing ↗</a></div></article>'}
async function searchCatalogV4(term){
 const q=String(term??$('catalogSearch')?.value??'').trim();
 if(!q)return toast('Type an item or style to search');
 const box=$('catalogSearchResults');if(!box)return;
 box.innerHTML='<div class="catalog-results-state">Searching the public Roblox catalog…</div>';
 try{
  if(!window.larpApi)throw new Error('Catalog service is starting');
  const response=await window.larpApi.get('/api/catalog/search?keyword='+encodeURIComponent(q));
  const items=response.data?.items||[];
  catalogV4Results=items.filter(x=>x.assetId&&x.name);
  if(catalogV4Results.length){
   box.innerHTML='<div class="catalog-results-state"><span class="catalog-live-tag">LIVE PUBLIC CATALOG</span> '+catalogV4Results.length+' Roblox listings · names, creators, prices and thumbnails</div><div class="catalog-result-grid">'+catalogV4Results.map(catalogCardV4).join('')+'</div>';
   return;
  }
  throw new Error('No live matches');
 }catch(error){
  const lower=q.toLowerCase();
  const shelf=[...CREATOR_ITEMS,...LOCAL_CATALOG];
  const seen=new Set();
  catalogV4Results=shelf.filter(x=>{
   const id=String(x.assetId);
   if(seen.has(id))return false;
   seen.add(id);
   return (String(x.name||'')+' '+String(x.creator||'')+' '+String(x.tags||'')).toLowerCase().includes(lower);
  }).slice(0,18);
  if(!catalogV4Results.length){
   box.innerHTML='<div class="empty">No matches. Try Y2K, halo, spider, wings, hat or face.</div>';
   return;
  }
  box.innerHTML='<div class="catalog-results-state"><span class="catalog-fallback-tag">CURATED FALLBACK</span> Live catalog unavailable · showing '+catalogV4Results.length+' saved public listings</div><div class="catalog-result-grid">'+catalogV4Results.map(catalogCardV4).join('')+'</div>';
 }
}
function addOwnedV4(x,equip){const id=String(x.assetId);const found=state.inventory.find(y=>String(y.assetId)===id);if(found){if(equip)found.equipped=true;save();render();toast(equip?'Equipped in demo avatar':'Already in demo inventory');return}state.inventory.unshift({id:'asset-'+id,name:x.name,type:x.type||'Accessories',image:x.image||'',assetId:id,price:x.price,creator:x.creator,sourceLink:x.tiktok||'',equipped:!!equip});save();render();toast(equip?'Added and equipped · local simulator':'Added to local demo inventory')}
function tryCreatorV4(key){const x=CREATOR_ITEMS.find(y=>y.key===key);if(x)addOwnedV4(x,true)}
function buyCreatorV4(key){const x=CREATOR_ITEMS.find(y=>y.key===key);if(x)buyDemoV4(x)}
function tryCatalogV4(id){const x=catalogV4Results.find(y=>String(y.assetId)===String(id));if(x)addOwnedV4(x,true)}
function buyCatalogV4(id){const x=catalogV4Results.find(y=>String(y.assetId)===String(id));if(x)buyDemoV4(x)}
function buyDemoV4(x){if(state.inventory.some(y=>String(y.assetId)===String(x.assetId)))return toast('Already in your demo inventory');const price=Number(x.price);if(!Number.isFinite(price)||price<0)return toast('No demo price for this listing');if(state.coins<price)return toast('Not enough demo Robux');if(!confirm('Buy '+x.name+' for '+fmt(price)+' DEMO R$? This only updates LarpBlox local data. Nothing is purchased on Roblox.'))return;state.coins-=price;state.inventory.unshift({id:'asset-'+x.assetId,name:x.name,type:x.type||'Accessories',image:x.image||'',assetId:String(x.assetId),price:price,creator:x.creator||'Roblox creator',equipped:false});save();render();toast('Demo purchase complete · local only')}
function catalogV4View(){return '<div class="content discover-page"><div class="discover-head"><div><div class="eyebrow">PUBLIC ROBLOX CATALOG PICKS</div><h1>Catalog</h1><p>Curated public listings with creator names, prices and original Roblox thumbnails.</p></div><div class="discover-wallet"><strong>R$ '+fmt(state.coins)+'</strong><small>DEMO BALANCE ONLY</small></div></div><div class="catalog-hero"><div class="eyebrow">FITS FROM THE FEED</div><h2>Find your signature item.</h2><p>Search real accessory listings, try them on locally and use demo-only currency for the pretend buy flow.</p></div><div class="catalog-search-row"><input id="catalogSearch" placeholder="Search Y2K, halo, spider, wings…" onkeydown="if(event.key===\'Enter\')searchCatalogV4()"><button onclick="searchCatalogV4()">SEARCH</button></div><div class="style-chips"><button onclick="catalogQuickV4(\'Y2K\')">Y2K</button><button onclick="catalogQuickV4(\'streetwear hat\')">Streetwear</button><button onclick="catalogQuickV4(\'halo\')">Halo</button><button onclick="catalogQuickV4(\'spider\')">Spider</button><button onclick="catalogQuickV4(\'wings\')">Wings</button></div><div id="catalogSearchResults" class="catalog-results-state">Search the live public Roblox catalog above.</div><hr style="border:0;border-top:1px solid #293548;margin:21px 0"><div class="discover-section-head"><div><h2>TikTok-linked UGC</h2><p>Creator posts link to matching Roblox catalog listings.</p></div></div><div class="ugc-grid">'+CREATOR_ITEMS.map(creatorCardV4).join('')+'</div><hr style="border:0;border-top:1px solid #293548;margin:21px 0"><div class="discover-section-head"><div><h2>Lookup by asset ID</h2><p>For a specific public catalog item.</p></div></div><div class="inventory-toolbar"><input id="assetId" class="search" inputmode="numeric" placeholder="Roblox catalog asset ID"><button class="btn primary" onclick="lookupAsset()">Search ID</button></div><p class="hint">Adding an item only changes this simulator. It does not purchase, grant or transfer anything on Roblox.</p><div id="assetResult"></div></div>'}


render();save();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

</script>
