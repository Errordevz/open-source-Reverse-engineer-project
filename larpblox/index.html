<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink)}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8ca6ff;outline-offset:2px}
.app{min-height:100vh}.top-edge{position:fixed;z-index:300;top:env(safe-area-inset-top);left:0;right:0;height:20px;touch-action:pan-x;display:flex;justify-content:center;align-items:flex-start}.hold-track{height:3px;width:min(230px,48vw);background:#00000010;border-radius:0 0 8px 8px;overflow:hidden;opacity:.12;transition:opacity .15s}.top-edge.charging .hold-track{opacity:1}.hold-fill{height:100%;width:0;background:var(--blue);transition:width .95s linear}
.header{height:56px;background:#191b1f;color:#fff;display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:50}.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.4px}.logo-mark{width:28px;height:28px;border-radius:8px;background:#fff;color:#191b1f;display:grid;place-items:center;font-size:17px;font-weight:950}.header-link{border:0;background:transparent;color:#d9dce2;font-size:13px;font-weight:650;padding:9px}.header-spacer{flex:1}.sim-chip{border:1px solid #806323;background:#332912;color:#ffdf8a;border-radius:5px;padding:5px 8px;font-size:9px;font-weight:900;letter-spacing:1px}
.shell{max-width:1040px;margin:0 auto;padding:20px 18px 100px}.page{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 2px 8px #10182808}.profile-banner{height:152px;background:linear-gradient(115deg,#1c2d55,#3158a8 58%,#5d82c7);position:relative;overflow:hidden}.profile-banner:before{content:"";position:absolute;width:340px;height:340px;border:1px solid #ffffff25;border-radius:50%;right:8%;top:-225px;box-shadow:0 0 0 32px #ffffff0b,0 0 0 70px #ffffff08}.profile-banner img{width:100%;height:100%;object-fit:cover}.profile-head{display:flex;align-items:flex-end;gap:16px;padding:0 22px 16px;position:relative}.avatar{width:116px;height:116px;border-radius:50%;background:#e9edf5;border:5px solid white;margin-top:-55px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:54px}.avatar img{width:100%;height:100%;object-fit:cover}.profile-details{padding:8px 0 3px;min-width:0;flex:1}.display-name{font-size:25px;font-weight:850;letter-spacing:-.7px;overflow-wrap:anywhere}.username{font-size:13px;color:#6e737c;margin-top:3px}.bio{font-size:12px;line-height:1.5;color:#505660;margin-top:9px;max-width:650px;white-space:pre-wrap}.profile-actions{display:flex;gap:8px;align-self:center;flex-wrap:wrap}.btn{border:1px solid #d6d9df;background:#fff;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:750;color:#252932}.btn:hover{background:#f5f6f8}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:var(--blue-dark)}.btn.subtle{background:#f1f3f6}.btn.small{padding:7px 10px;font-size:11px}.stats{display:flex;gap:0;padding:0 22px 17px}.stat{padding-right:25px;margin-right:25px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font-size:17px;display:block}.stat span{font-size:11px;color:#777d86}.tabs{display:flex;gap:24px;padding:0 22px;border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;padding:13px 0 12px;color:#606670;font-size:12px;font-weight:750;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:#20242b;border-color:var(--blue)}
.content{padding:20px 22px 25px}.section{margin-bottom:23px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-title h2{font-size:15px;margin:0;font-weight:850}.section-title button{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:750}.about-card{border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;line-height:1.65;color:#4c535e;white-space:pre-wrap}.horizontal{display:flex;gap:10px;overflow:auto;padding:1px 1px 8px;scrollbar-width:thin}.friend{width:76px;flex:none;text-align:center}.friend-pic{width:58px;height:58px;border-radius:50%;margin:0 auto 7px;background:#e9edf5;display:grid;place-items:center;font-size:25px;overflow:hidden}.friend-pic img{width:100%;height:100%;object-fit:cover}.friend small{display:block;font-size:10px;color:#4d535d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.item{border:1px solid var(--line);border-radius:10px;padding:9px;min-width:0;background:#fff}.item-art{height:112px;border-radius:7px;background:#f1f3f6;display:grid;place-items:center;overflow:hidden;font-size:38px;margin-bottom:8px}.item-art img{width:100%;height:100%;object-fit:contain}.item strong{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{display:block;font-size:10px;color:#7b818b;margin-top:4px}.pill{display:inline-block;background:#edf1ff;color:#3454c6;border-radius:20px;padding:4px 7px;font-size:9px;font-weight:800;margin-top:6px}.empty{padding:28px;text-align:center;color:#777e89;font-size:12px;border:1px dashed #d7dbe2;border-radius:10px}
.inventory-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.search{border:1px solid #d8dce3;background:#fff;border-radius:8px;padding:10px 12px;min-width:0;flex:1;font-size:12px}.filter-row{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.filter{border:1px solid #d9dde4;background:#fff;border-radius:20px;padding:7px 11px;font-size:10px;font-weight:750;white-space:nowrap}.filter.active{background:#eaf0ff;border-color:#b9c8ff;color:#294cc8}
.avatar-layout{display:grid;grid-template-columns:minmax(250px,.9fr) minmax(0,1.1fr);gap:15px}.avatar-stage{min-height:390px;border-radius:12px;background:radial-gradient(ellipse at 50% 38%,#e6ebf6,#f8f9fb 68%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:18px}.avatar-figure{width:174px;height:238px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}.avatar-figure .head{width:83px;height:83px;border-radius:26px;background:#e8b98d;border:3px solid #fff;box-shadow:0 2px 8px #0001;display:grid;place-items:center;font-size:43px;z-index:2}.avatar-figure .torso{width:110px;height:88px;border-radius:22px 22px 12px 12px;background:#4777d9;margin-top:-4px;border:3px solid #fff}.avatar-figure .legs{display:flex;gap:6px;margin-top:-2px}.avatar-figure .legs span{width:49px;height:66px;background:#344b82;border:3px solid #fff;border-radius:8px 8px 12px 12px}.avatar-caption{font-size:12px;font-weight:800}.avatar-sub{font-size:10px;color:#7a818d}.editor-panel{border:1px solid var(--line);border-radius:12px;padding:15px}.editor-panel h3{font-size:14px;margin:0 0 12px}.edit-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0f3}.edit-item:last-child{border:0}.edit-item .item-art{width:52px;height:52px;flex:none;margin:0}.edit-meta{flex:1;min-width:0}.edit-meta strong{font-size:11px}.edit-meta small{display:block;font-size:10px;color:#7d838d;margin-top:3px}
.backdrop{position:fixed;inset:0;background:#10131a99;z-index:190;opacity:0;pointer-events:none;transition:opacity .2s}.backdrop.open{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:191;left:50%;bottom:0;transform:translate(-50%,105%);width:min(780px,100%);max-height:min(88vh,820px);background:#fff;border:1px solid #d9dde5;border-bottom:0;border-radius:19px 19px 0 0;box-shadow:0 -18px 70px #0003;transition:transform .27s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}.sheet.open{transform:translate(-50%,0)}.sheet-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.sheet-head strong{font-size:15px}.save-state{font-size:10px;color:var(--green);margin-left:auto}.sheet-close{border:1px solid #d6dbe3;background:#f6f7f9;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:750}.sheet-body{display:grid;grid-template-columns:155px minmax(0,1fr);min-height:0;overflow:hidden}.sheet-nav{padding:12px 9px;border-right:1px solid var(--line);overflow:auto}.sheet-nav button{width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:transparent;color:#59616d;font-size:11px;font-weight:750}.sheet-nav button.active{background:#eaf0ff;color:#294cc8}.sheet-content{padding:17px;overflow:auto;max-height:calc(88vh - 68px)}.sheet-content h3{font-size:14px;margin:0 0 13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:10px;color:#616975;font-weight:850;letter-spacing:.4px}.field input,.field textarea,.field select{background:#fff;border:1px solid #d9dde4;color:#20242b;border-radius:8px;padding:10px 11px;width:100%;outline:none;font-size:12px}.field textarea{min-height:70px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:10px;color:#777f8a;line-height:1.55;margin:6px 0 12px}.toast{position:fixed;z-index:320;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#20242b;color:#fff;border-radius:99px;padding:10px 15px;font-size:11px;box-shadow:0 6px 25px #0003;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}.mobile-nav{display:none}.watermark{position:fixed;right:10px;bottom:13px;z-index:80;color:#5e6470;background:#ffffffed;border:1px solid #d9dde4;padding:5px 8px;border-radius:6px;font-size:8px;font-weight:950;letter-spacing:1px;pointer-events:none}
@media(max-width:680px){.mobile-nav{position:fixed;z-index:150;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:2px;padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(16px);border-top:1px solid #dfe3e9}.mobile-nav button{flex:1;display:grid;justify-items:center;gap:3px;border:0;background:transparent;color:#777e89;font-size:9px;font-weight:750;padding:4px 1px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--blue)}.watermark{bottom:calc(65px + env(safe-area-inset-bottom))}.header{height:53px;padding:0 13px}.header-link{display:none}.shell{padding:0 0 90px}.page{border:0;border-radius:0;box-shadow:none}.profile-banner{height:120px}.profile-head{padding:0 14px 14px;gap:11px;flex-wrap:wrap}.avatar{width:88px;height:88px;margin-top:-42px;font-size:40px}.display-name{font-size:20px}.profile-details{padding-top:7px}.profile-actions{width:100%;padding-left:0}.profile-actions .btn{flex:1}.stats{padding:0 14px 14px;gap:0}.stat{padding-right:14px;margin-right:14px}.stat strong{font-size:15px}.tabs{gap:20px;padding:0 14px}.content{padding:17px 14px 25px}.item-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item-art{height:105px}.avatar-layout{grid-template-columns:1fr}.avatar-stage{min-height:270px}.avatar-figure{transform:scale(.84);height:205px}.sheet{max-height:90vh}.sheet-body{grid-template-columns:112px minmax(0,1fr)}.sheet-nav{padding:9px 6px}.sheet-nav button{padding:9px 7px;font-size:10px}.sheet-content{padding:14px 11px;max-height:calc(90vh - 68px)}.field-row{grid-template-columns:1fr}.watermark{bottom:calc(68px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div class="top-edge" id="topEdge" aria-label="Hold top edge to open Backstage"><div class="hold-track"><div class="hold-fill" id="holdFill"></div></div></div>
<div class="app">
<header class="header"><div class="logo"><span class="logo-mark">◈</span><span>LarpBlox</span></div><button class="header-link" onclick="go('profile')">Discover</button><button class="header-link" onclick="go('avatar')">Avatar</button><span class="header-spacer"></span><span class="sim-chip">SIMULATOR</span></header>
<div class="shell"><main class="page" id="page"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div class="watermark">SIMULATOR · NOT ROBLOX</div>
<div class="backdrop" id="backdrop" onclick="closeBackstage()"></div>
<section class="sheet" id="sheet" aria-label="Backstage editor">
<header class="sheet-head"><strong>⚙ Backstage</strong><span class="save-state" id="saveState">● Saved locally</span><button class="sheet-close" onclick="closeBackstage()">Done ✕</button></header>
<div class="sheet-body"><nav class="sheet-nav" id="sheetNav"></nav><div class="sheet-content" id="sheetContent"></div></div>
</section>
<div class="toast hidden" id="toast"></div>
<script>
const KEY='larpblox-v3';
const defaults={
 displayName:'Player One',username:'player_one',bio:'Welcome to my profile!',about:'',avatarUrl:'',coverUrl:'',userId:null,
 friendsCount:48,followers:1240,following:85,coins:1250,outfit:'Classic',
 inventory:[
  {id:'hat-1',name:'Classic Cap',type:'Accessories',emoji:'🧢',image:'',assetId:'',equipped:true},
  {id:'face-1',name:'Pixel Shades',type:'Accessories',emoji:'🕶️',image:'',assetId:'',equipped:false},
  {id:'shirt-1',name:'Blue Hoodie',type:'Clothing',emoji:'👕',image:'',assetId:'',equipped:true},
  {id:'gear-1',name:'Sparkle Trail',type:'Gear',emoji:'✨',image:'',assetId:'',equipped:false},
  {id:'collect-1',name:'Golden Trophy',type:'Collectibles',emoji:'🏆',image:'',assetId:'',equipped:false}
 ],
 friends:[{name:'BuilderKai',emoji:'🧑‍🔧'},{name:'PixelMia',emoji:'👩‍🎨'},{name:'NovaPlays',emoji:'🧑‍🚀'},{name:'BlockyBen',emoji:'🧑‍💻'}],
 games:[{name:'Skyline Obby',description:'A colorful obstacle course',emoji:'🌆',visits:'8.2K'},{name:'Pet Plaza',description:'Collect and trade pets',emoji:'🐾',visits:'6.1K'},{name:'Tower Rush',description:'Climb to the top',emoji:'🗼',visits:'3.9K'}],
 badges:[{name:'Welcome!',emoji:'👋'},{name:'Explorer',emoji:'🧭'},{name:'Builder',emoji:'🛠️'}],
 favorites:[{name:'Natural Disaster Survival',emoji:'🌪️'},{name:'Brookhaven RP',emoji:'🏡'},{name:'Tower of Hell',emoji:'🗼'}]
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');const migrated={...clone(defaults),...old};if(!old.displayName&&old.name)migrated.displayName=old.name;if(!old.outfit)migrated.outfit='Classic';migrated.inventory=Array.isArray(old.inventory)?old.inventory:clone(defaults.inventory);migrated.friends=Array.isArray(old.friends)?old.friends:clone(defaults.friends);migrated.games=Array.isArray(old.games)?old.games:clone(defaults.games);migrated.badges=Array.isArray(old.badges)?old.badges:clone(defaults.badges);migrated.favorites=Array.isArray(old.favorites)?old.favorites:clone(defaults.favorites);return migrated}catch{return clone(defaults)}}
let state=loadState(),activeTab='About',activePage='profile',backstageTab='profile',filter='All',query='';
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){return Number(v||0).toLocaleString('en-US')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('saveState').textContent='● Saved locally';$('saveState').style.color='#159b69'}catch{$('saveState').textContent='Storage full';$('saveState').style.color='#bd4a3b'}}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function avatar(){return state.avatarUrl?'<img src="'+esc(state.avatarUrl)+'" alt="Profile avatar">':'🧑‍🚀'}
function art(item){return item.image?'<img src="'+esc(item.image)+'" alt="">':esc(item.emoji||'🎁')}
function go(page){activePage=page;render()}
function setTab(tab){activeTab=tab;render()}
function stat(label,value){return '<div class="stat"><strong>'+fmt(value)+'</strong><span>'+label+'</span></div>'}
function section(title,body,action){return '<section class="section"><div class="section-title"><h2>'+title+'</h2>'+(action||'')+'</div>'+body+'</section>'}
function profileHeader(){return '<div class="profile-banner">'+(state.coverUrl?'<img src="'+esc(state.coverUrl)+'" alt="">':'')+'</div><div class="profile-head"><div class="avatar">'+avatar()+'</div><div class="profile-details"><div class="display-name">'+esc(state.displayName)+'</div><div class="username">@'+esc(state.username)+(state.userId?' · '+state.userId:'')+'</div><div class="bio">'+esc(state.bio)+'</div></div><div class="profile-actions"><button class="btn primary" onclick="toast(\'Follow is a local demo action\')">＋ Follow</button><button class="btn" onclick="toast(\'Demo profile · no messages are sent\')">Message</button></div></div><div class="stats">'+stat('Friends',state.friendsCount)+stat('Followers',state.followers)+stat('Following',state.following)+stat('Demo Robux',state.coins)+'</div>'}
function friendStrip(){return '<div class="horizontal">'+state.friends.slice(0,24).map(f=>'<div class="friend"><div class="friend-pic">'+(f.image?'<img src="'+esc(f.image)+'" alt="">':esc(f.emoji||'👤'))+'</div><small>'+esc(f.name)+'</small></div>').join('')+'</div>'}
function itemGrid(items,controls=false){return '<div class="item-grid">'+items.map(i=>'<article class="item"><div class="item-art">'+art(i)+'</div><strong>'+esc(i.name)+'</strong><small>'+esc(i.type||'Item')+'</small>'+(i.equipped?'<span class="pill">Wearing</span>':'')+(controls?'<button class="btn small" style="margin-top:8px;width:100%" onclick="toggleEquip(\''+esc(i.id)+'\')">'+(i.equipped?'Take off':'Wear')+'</button>':'')+'</article>').join('')+'</div>'}
function badgeStrip(){return '<div class="horizontal">'+state.badges.map(b=>'<div class="friend"><div class="friend-pic">'+esc(b.emoji||'🏅')+'</div><small>'+esc(b.name)+'</small></div>').join('')+'</div>'}
function gameGrid(items){return '<div class="item-grid">'+items.map(g=>'<article class="item"><div class="item-art">'+(g.image?'<img src="'+esc(g.image)+'" alt="">':esc(g.emoji||'🎮'))+'</div><strong>'+esc(g.name)+'</strong><small>'+esc(g.description||'Experience')+'</small><small>'+esc(g.visits||'0')+' visits</small></article>').join('')+'</div>'}
function aboutView(){return section('About','<div class="about-card">'+esc(state.about||'This player has not added an about description yet.')+'</div>')+section('Friends','<div class="subtle" style="margin-bottom:10px">'+fmt(state.friendsCount)+' friends</div>'+friendStrip(),'<button onclick="go(\'friends\')">See all</button>')+section('Currently Wearing',itemGrid(state.inventory.filter(x=>x.equipped).slice(0,8)),'<button onclick="go(\'avatar\')">Edit avatar</button>')+section('Creations',gameGrid(state.games.slice(0,4)),'<button onclick="go(\'creations\')">See all</button>')+section('Badges',badgeStrip(),'<button onclick="go(\'badges\')">See all</button>')}
function inventoryView(){const types=['All','Accessories','Clothing','Gear','Collectibles'];const list=state.inventory.filter(x=>(filter==='All'||x.type===filter)&&(!query||x.name.toLowerCase().includes(query.toLowerCase())));return '<div class="content"><div class="section-title"><div><h2>Inventory</h2><div class="subtle">'+state.inventory.length+' displayed items</div></div></div><div class="inventory-toolbar"><input class="search" placeholder="Search inventory" value="'+esc(query)+'" oninput="filterInventory(this.value)"><button class="btn" onclick="openBackstage(\'inventory\')">＋ Add item</button></div><div class="filter-row">'+types.map(t=>'<button class="filter '+(filter===t?'active':'')+'" onclick="filter=\''+t+'\';render()">'+t+'</button>').join('')+'</div>'+(list.length?itemGrid(list,true):'<div class="empty">No items match this filter.</div>')+'</div>'}
function avatarView(){return '<div class="content"><div class="section-title"><div><h2>Avatar editor</h2><div class="subtle">Preview and manage your displayed outfit</div></div><button class="btn" onclick="openBackstage(\'avatar\')">Avatar settings</button></div><div class="avatar-layout"><div class="avatar-stage">'+(state.avatarUrl?'<img src="'+esc(state.avatarUrl)+'" alt="Avatar preview" style="width:180px;height:220px;object-fit:contain">':'<div class="avatar-figure"><div class="head">🙂</div><div class="torso"></div><div class="legs"><span></span><span></span></div></div>')+'<div class="avatar-caption">'+esc(state.displayName)+'</div><div class="avatar-sub">'+esc(state.outfit||'Classic outfit')+'</div></div><div class="editor-panel"><h3>Wearing now</h3>'+(state.inventory.filter(x=>x.equipped).map((x)=>'<div class="edit-item"><div class="item-art">'+art(x)+'</div><div class="edit-meta"><strong>'+esc(x.name)+'</strong><small>'+esc(x.type)+'</small></div><button class="btn small" onclick="toggleEquip(\''+esc(x.id)+'\')">Remove</button></div>').join('')||'<div class="empty">Nothing equipped yet.</div>')+'<p class="hint">Tap an item in your inventory to equip it. This only changes the local simulator preview.</p><button class="btn primary" onclick="go(\'inventory\')">Browse inventory</button></div></div></div>'}
function friendsView(){return '<div class="content"><div class="section-title"><div><h2>Friends</h2><div class="subtle">'+state.friends.length+' displayed profiles · '+fmt(state.friendsCount)+' total count</div></div><button class="btn" onclick="openBackstage(\'friends\')">Manage</button></div>'+(state.friends.length?'<div class="item-grid">'+state.friends.map(f=>'<article class="item"><div class="item-art">'+(f.image?'<img src="'+esc(f.image)+'">':esc(f.emoji||'👤'))+'</div><strong>'+esc(f.name)+'</strong><small>Friend</small></article>').join('')+'</div>':'<div class="empty">No friends added.</div>')+'</div>'}
function creationsView(){return '<div class="content"><div class="section-title"><div><h2>Creations</h2><div class="subtle">Experiences shown on this profile</div></div><button class="btn" onclick="openBackstage(\'games\')">Manage</button></div>'+(state.games.length?gameGrid(state.games):'<div class="empty">No creations added.</div>')+'</div>'}
function badgesView(){return '<div class="content"><div class="section-title"><div><h2>Badges</h2><div class="subtle">'+state.badges.length+' displayed badges</div></div><button class="btn" onclick="openBackstage(\'badges\')">Manage</button></div><div class="horizontal">'+state.badges.map(b=>'<div class="friend"><div class="friend-pic">'+esc(b.emoji||'🏅')+'</div><small>'+esc(b.name)+'</small></div>').join('')+'</div></div>'}
function favoritesView(){return '<div class="content"><div class="section-title"><div><h2>Favorites</h2><div class="subtle">Experiences this profile likes</div></div></div>'+gameGrid(state.favorites)+'</div>'}
function render(){const tabs=['About','Creations','Favorites','Inventory','Badges'];let body='';if(activePage==='avatar')body=avatarView();else if(activePage==='catalog')body=catalogView();else if(activePage==='friends')body=friendsView();else if(activePage==='inventory')body=inventoryView();else if(activePage==='creations')body=creationsView();else if(activePage==='badges')body=badgesView();else if(activeTab==='Creations')body=creationsView();else if(activeTab==='Favorites')body=favoritesView();else if(activeTab==='Inventory')body=inventoryView();else if(activeTab==='Badges')body=badgesView();else body='<div class="content">'+aboutView()+'</div>';$('page').innerHTML=profileHeader()+'<nav class="tabs">'+tabs.map(t=>'<button class="tab '+(activePage==='profile'&&activeTab===t?'active':'')+'" onclick="activePage=\'profile\';setTab(\''+t+'\')">'+t+'</button>').join('')+'</nav>'+body;$('mobileNav').innerHTML=[['profile','⌂','Profile'],['avatar','◉','Avatar'],['catalog','▦','Catalog'],['inventory','▤','Inventory'],['friends','♧','Friends']].map(x=>'<button class="'+(activePage===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')}
function toggleEquip(id){const item=state.inventory.find(x=>String(x.id)===String(id));if(!item)return;item.equipped=!item.equipped;save();render()}
function filterInventory(value){query=value;render();const input=document.querySelector('.inventory-toolbar .search');if(input){input.focus();input.setSelectionRange(query.length,query.length)}}
const backstageItems=[['profile','Profile'],['avatar','Avatar'],['inventory','Inventory'],['friends','Friends'],['games','Creations'],['badges','Badges'],['settings','Settings']];
function openBackstage(tab){backstageTab=tab||'profile';renderBackstage();$('backdrop').classList.add('open');$('sheet').classList.add('open');document.body.style.overflow='hidden'}
function closeBackstage(){$('backdrop').classList.remove('open');$('sheet').classList.remove('open');document.body.style.overflow='';save();render()}
function renderBackstage(){
 $('sheetNav').innerHTML=backstageItems.map(t=>'<button class="'+(backstageTab===t[0]?'active':'')+'" onclick="backstageTab=\''+t[0]+'\';renderBackstage()">'+t[1]+'</button>').join('');
 let v='';
 if(backstageTab==='profile')v='<h3>Profile details</h3><div class="field"><label>DISPLAY NAME</label><input data-key="displayName" value="'+esc(state.displayName)+'"></div><div class="field"><label>USERNAME</label><input data-key="username" value="'+esc(state.username)+'"></div><div class="field"><label>BIO</label><textarea data-key="bio">'+esc(state.bio)+'</textarea></div><div class="field"><label>ABOUT</label><textarea data-key="about">'+esc(state.about)+'</textarea></div><div class="field-row"><div class="field"><label>FRIENDS COUNT</label><input data-key="friendsCount" type="number" value="'+state.friendsCount+'"></div><div class="field"><label>FOLLOWERS</label><input data-key="followers" type="number" value="'+state.followers+'"></div><div class="field"><label>FOLLOWING</label><input data-key="following" type="number" value="'+state.following+'"></div><div class="field"><label>DEMO ROBUX</label><input data-key="coins" type="number" value="'+state.coins+'"></div></div><div class="field"><label>PROFILE COVER IMAGE URL</label><input data-key="coverUrl" value="'+esc(state.coverUrl)+'" placeholder="https://…"></div><div class="field"><label>AVATAR IMAGE URL</label><input data-key="avatarUrl" value="'+esc(state.avatarUrl)+'" placeholder="https://…"></div><div class="field"><label>UPLOAD AVATAR</label><input type="file" accept="image/*" onchange="uploadImage(this,\'avatarUrl\')"></div><div class="field"><label>UPLOAD COVER</label><input type="file" accept="image/*" onchange="uploadImage(this,\'coverUrl\')"></div><div class="field"><label>PUBLIC ROBLOX USERNAME LOOKUP</label><div class="inventory-toolbar"><input id="lookupName" class="search" placeholder="Username only"><button class="btn primary" onclick="importPublicProfile()">Import</button></div></div><p class="hint">Public profile data only. Never enter a Roblox password, cookie, token or recovery code.</p>';
 if(backstageTab==='avatar')v='<h3>Avatar and outfit</h3><div class="field"><label>OUTFIT NAME</label><input data-key="outfit" value="'+esc(state.outfit||'Classic')+'"></div><div class="field"><label>AVATAR IMAGE URL</label><input data-key="avatarUrl" value="'+esc(state.avatarUrl)+'"></div><div class="field"><label>UPLOAD AVATAR IMAGE</label><input type="file" accept="image/*" onchange="uploadImage(this,\'avatarUrl\')"></div><button class="btn" onclick="importWornAvatar()">Import worn public items</button><p class="hint">Avatar items are shown locally. No Roblox account changes are made.</p>';
 if(backstageTab==='inventory')v='<h3>Inventory manager</h3><div class="field-row"><div class="field"><label>ITEM NAME</label><input id="newItemName" placeholder="Galaxy Crown"></div><div class="field"><label>ITEM CATEGORY</label><select id="newItemType"><option>Accessories</option><option>Clothing</option><option>Gear</option><option>Collectibles</option></select></div></div><div class="field-row"><div class="field"><label>EMOJI</label><input id="newItemEmoji" value="🎁"></div><div class="field"><label>IMAGE URL</label><input id="newItemImage" placeholder="https://…"></div></div><div class="field"><label>ROBLOX ASSET ID (OPTIONAL)</label><input id="newItemAsset" placeholder="Numeric asset ID"></div><button class="btn primary" onclick="addInventoryItem()">Add item</button><div style="margin-top:12px">'+state.inventory.map((x,i)=>'<div class="edit-item"><div class="item-art">'+art(x)+'</div><div class="edit-meta"><strong>'+esc(x.name)+'</strong><small>'+esc(x.type)+'</small></div><button class="btn small" onclick="removeItem('+i+')">Remove</button></div>').join('')+'</div><button class="btn" style="margin-top:12px" onclick="importPublicCollectibles()">Import public collectibles</button><p class="hint">Local simulator inventory. Items are not granted to a Roblox account.</p>';
 if(backstageTab==='friends')v='<h3>Friends manager</h3><div class="inventory-toolbar"><input id="newFriend" class="search" placeholder="Display name"><button class="btn primary" onclick="addFriend()">Add friend</button></div><button class="btn" onclick="importPublicFriends()">Import public friends (if visible)</button><div style="margin-top:12px">'+state.friends.map((f,i)=>'<div class="edit-item"><div class="item-art">'+esc(f.emoji||'👤')+'</div><div class="edit-meta"><strong>'+esc(f.name)+'</strong><small>Displayed friend</small></div><button class="btn small" onclick="removeFriend('+i+')">Remove</button></div>').join('')+'</div>';
 if(backstageTab==='games')v='<h3>Creations manager</h3><div class="inventory-toolbar"><input id="newGame" class="search" placeholder="Experience name"><button class="btn primary" onclick="addGame()">Add</button></div><button class="btn" onclick="importPublicGames()">Import public creations</button><div style="margin-top:12px">'+state.games.map((g,i)=>'<div class="edit-item"><div class="item-art">'+art(g)+'</div><div class="edit-meta"><strong>'+esc(g.name)+'</strong><small>'+esc(g.description||'Experience')+'</small></div><button class="btn small" onclick="removeGame('+i+')">Remove</button></div>').join('')+'</div>';
 if(backstageTab==='badges')v='<h3>Badge manager</h3><div class="inventory-toolbar"><input id="newBadge" class="search" placeholder="Badge name"><button class="btn primary" onclick="addBadge()">Add badge</button></div>'+state.badges.map((b,i)=>'<div class="edit-item"><div class="item-art">'+esc(b.emoji||'🏅')+'</div><div class="edit-meta"><strong>'+esc(b.name)+'</strong><small>Displayed badge</small></div><button class="btn small" onclick="state.badges.splice('+i+',1);save();renderBackstage();render()">Remove</button></div>').join('');
 if(backstageTab==='settings')v='<h3>Simulator settings</h3><p class="hint">Your profile is saved in this browser on this device.</p><button class="btn" onclick="exportProfile()">Export profile JSON</button> <button class="btn" onclick="$(\'importJson\').click()">Import profile JSON</button><input id="importJson" class="hidden" type="file" accept="application/json" onchange="importProfileFile(this)"><hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0"><button class="btn" onclick="resetProfile()">Reset simulator data</button><p class="hint">LarpBlox is an unofficial, local-only simulator. It cannot change Roblox accounts, items, Robux, trades or balances.</p>';
 $('sheetContent').innerHTML=v;
}
$('sheetContent').addEventListener('input',e=>{const k=e.target.dataset.key;if(!k)return;state[k]=['coins','followers','following','friendsCount'].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();if(['displayName','username','bio','avatarUrl','coverUrl','coins','followers','friendsCount'].includes(k))render()});
$('sheetContent').addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;state[k]=['coins','followers','following','friendsCount'].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();render()});
function uploadImage(input,key){const file=input.files?.[0];if(!file)return;if(file.size>1400000)return toast('Choose an image under 1.4 MB');const reader=new FileReader();reader.onload=()=>{state[key]=reader.result;save();render();renderBackstage();toast('Image saved locally')};reader.readAsDataURL(file)}
function addInventoryItem(){const name=$('newItemName').value.trim();if(!name)return toast('Enter an item name');state.inventory.unshift({id:'custom-'+Date.now(),name,type:$('newItemType').value,emoji:$('newItemEmoji').value||'🎁',image:$('newItemImage').value||'',assetId:$('newItemAsset').value||'',equipped:false});save();renderBackstage();render();toast('Added to simulator inventory')}
function removeItem(i){state.inventory.splice(i,1);save();renderBackstage();render()}
function addFriend(){const name=$('newFriend').value.trim();if(!name)return toast('Enter a friend name');state.friends.push({name,emoji:'👤'});state.friendsCount=Math.max(state.friendsCount,state.friends.length);save();renderBackstage();render()}
function removeFriend(i){state.friends.splice(i,1);state.friendsCount=Math.max(0,state.friendsCount-1);save();renderBackstage();render()}
function addGame(){const name=$('newGame').value.trim();if(!name)return toast('Enter a game name');state.games.push({name,emoji:'🎮',visits:'0'});save();renderBackstage();render()}
function removeGame(i){state.games.splice(i,1);save();renderBackstage();render()}
function addBadge(){const name=$('newBadge').value.trim();if(!name)return toast('Enter a badge name');state.badges.push({name,emoji:'🏅'});save();renderBackstage();render()}
function catalogView(){return '<div class="content"><div class="section-title"><div><h2>Catalog</h2><div class="subtle">Public catalog thumbnail lookup</div></div></div><div class="inventory-toolbar"><input id="assetId" class="search" inputmode="numeric" placeholder="Enter a Roblox catalog asset ID"><button class="btn primary" onclick="lookupAsset()">Search</button></div><p class="hint">This reads public thumbnails only. Adding an item puts it in your local simulator inventory; it does not purchase or grant it.</p><div id="assetResult"></div><div class="section-title" style="margin-top:24px"><h2>Community items</h2></div>'+itemGrid(state.inventory.slice(0,8))+'</div>'}
async function lookupAsset(){const id=$('assetId').value.trim();if(!/^\\d+$/.test(id))return toast('Enter a numeric asset ID');const box=$('assetResult');box.innerHTML='<p class="hint">Loading public item thumbnail…</p>';try{const response=await fetch('https://thumbnails.roblox.com/v1/assets?assetIds='+id+'&size=420x420&format=Png');if(!response.ok)throw Error('Thumbnail unavailable');const result=await response.json();const image=result.data?.[0]?.imageUrl;if(!image)throw Error('No public thumbnail found');box.innerHTML='<div class="edit-item"><div class="item-art"><img src="'+esc(image)+'"></div><div class="edit-meta"><strong>Catalog item #'+esc(id)+'</strong><small>Public asset thumbnail</small></div><button class="btn primary" onclick="addCatalogAsset(\''+esc(id)+'\',\''+esc(image)+'\')">Add to inventory</button></div>'}catch(error){box.innerHTML='<p class="hint">'+esc(error.message)+'</p>'}}
function addCatalogAsset(id,image){state.inventory.unshift({id:'asset-'+id,name:'Catalog item '+id,type:'Accessories',emoji:'🎁',image,assetId:id,equipped:false});save();render();toast('Added to local simulator inventory')}
async function importPublicProfile(){const name=$('lookupName').value.trim();if(!name)return toast('Enter a public username');toast('Looking up public Roblox profile…');try{const response=await fetch('https://users.roblox.com/v1/usernames/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usernames:[name],excludeBannedUsers:true})});if(!response.ok)throw Error('Username lookup unavailable');const result=await response.json();if(!result.data?.length)throw Error('User not found');const user=result.data[0];state.userId=user.id;state.username=user.name;state.displayName=user.displayName||user.name;const results=await Promise.allSettled([fetch('https://thumbnails.roblox.com/v1/users/avatar?userIds='+user.id+'&size=420x420&format=Png&isCircular=false').then(x=>x.json()),fetch('https://friends.roblox.com/v1/users/'+user.id+'/followers/count').then(x=>x.json()),fetch('https://friends.roblox.com/v1/users/'+user.id+'/friends/count').then(x=>x.json()),fetch('https://users.roblox.com/v1/users/'+user.id).then(x=>x.json())]);if(results[0].status==='fulfilled'&&results[0].value.data?.[0]?.imageUrl)state.avatarUrl=results[0].value.data[0].imageUrl;if(results[1].status==='fulfilled')state.followers=results[1].value.count??state.followers;if(results[2].status==='fulfilled')state.friendsCount=results[2].value.count??state.friendsCount;if(results[3].status==='fulfilled'&&results[3].value.description)state.about=results[3].value.description;save();render();renderBackstage();toast('Public profile imported')}catch(error){toast(error.message+' · try again or add an image manually')}}
async function importPublicFriends(){if(!state.userId)return toast('Import a public username first');try{const response=await fetch('https://friends.roblox.com/v1/users/'+state.userId+'/friends');if(!response.ok)throw Error('Friends list is private or unavailable');const result=await response.json();state.friends=(result.data||[]).slice(0,60).map(x=>({name:x.displayName||x.name,emoji:'👤',userId:x.id}));save();renderBackstage();render();toast('Imported '+state.friends.length+' public friends')}catch(error){toast(error.message)}}
async function importPublicGames(){if(!state.userId)return toast('Import a public username first');try{const response=await fetch('https://games.roblox.com/v2/users/'+state.userId+'/games?accessFilter=Public&limit=50&sortOrder=Asc');if(!response.ok)throw Error('Public creations unavailable');const result=await response.json();state.games=(result.data||[]).slice(0,30).map(g=>({name:g.name,description:g.description||'Roblox experience',emoji:'🎮',visits:fmt(g.placeVisits||0),universeId:g.id}));const ids=state.games.map(g=>g.universeId).filter(Boolean);if(ids.length){const thumbs=await fetch('https://thumbnails.roblox.com/v1/games/icons?universeIds='+ids.join(',')+'&size=256x256&format=Png&isCircular=false').then(x=>x.json());for(const thumb of thumbs.data||[]){const game=state.games.find(g=>g.universeId===thumb.targetId);if(game)game.image=thumb.imageUrl}}save();renderBackstage();render();toast('Imported public creations')}catch(error){toast(error.message)}}
async function importWornAvatar(){if(!state.userId)return toast('Import a public username first');try{const response=await fetch('https://avatar.roblox.com/v1/users/'+state.userId+'/avatar');if(!response.ok)throw Error('Public avatar data unavailable');const result=await response.json();const assets=result.assets||[];const ids=assets.map(x=>x.id).filter(Boolean);let thumbs={};if(ids.length){const thumbData=await fetch('https://thumbnails.roblox.com/v1/assets?assetIds='+ids.join(',')+'&size=150x150&format=Png').then(x=>x.json());for(const thumb of thumbData.data||[])thumbs[thumb.targetId]=thumb.imageUrl}for(const asset of assets){if(state.inventory.some(x=>String(x.assetId)===String(asset.id)))continue;state.inventory.push({id:'worn-'+asset.id,name:asset.name||('Avatar item '+asset.id),type:'Accessories',emoji:'🎁',image:thumbs[asset.id]||'',assetId:String(asset.id),equipped:true})}save();renderBackstage();render();toast('Imported '+assets.length+' worn items')}catch(error){toast(error.message)}}
async function importPublicCollectibles(){if(!state.userId)return toast('Import a public username first');try{const response=await fetch('https://inventory.roblox.com/v1/users/'+state.userId+'/assets/collectibles?limit=100&sortOrder=Desc');if(!response.ok)throw Error('Collectibles are private or unavailable');const result=await response.json();for(const asset of result.data||[]){if(state.inventory.some(x=>String(x.assetId)===String(asset.assetId)))continue;state.inventory.push({id:'collectible-'+asset.assetId,name:asset.name||('Collectible '+asset.assetId),type:'Collectibles',emoji:'💎',image:'',assetId:String(asset.assetId),equipped:false})}save();renderBackstage();render();toast('Imported '+(result.data||[]).length+' public collectibles')}catch(error){toast(error.message)}}
function exportProfile(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='larpblox-profile.json';link.click();URL.revokeObjectURL(url)}
function importProfileFile(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state={...clone(defaults),...JSON.parse(reader.result)};save();render();renderBackstage();toast('Profile imported')}catch{toast('Invalid profile JSON')}};reader.readAsText(file)}
function resetProfile(){if(!confirm('Reset all LarpBlox simulator data on this device?'))return;localStorage.removeItem(KEY);state=clone(defaults);save();render();renderBackstage();toast('Simulator reset')}
let holdTimer=null,holding=false;const edge=$('topEdge'),fill=$('holdFill');
edge.addEventListener('pointerdown',event=>{if(event.button!==undefined&&event.button!==0)return;holding=true;edge.classList.add('charging');fill.style.transition='width .95s linear';requestAnimationFrame(()=>fill.style.width='100%');holdTimer=setTimeout(()=>{if(!holding)return;holding=false;edge.classList.remove('charging');fill.style.transition='none';fill.style.width='0';openBackstage();if(navigator.vibrate)navigator.vibrate(12)},950)});
function cancelHold(){holding=false;clearTimeout(holdTimer);edge.classList.remove('charging');fill.style.transition='width .12s linear';fill.style.width='0'}
edge.addEventListener('pointerup',cancelHold);edge.addEventListener('pointercancel',cancelHold);edge.addEventListener('pointerleave',cancelHold);edge.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBackstage()});
render();save();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
